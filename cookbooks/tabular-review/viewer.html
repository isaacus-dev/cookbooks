    }

    function buildRow(entry, rowIndex, forcedRowId = "") {
      const doc = entry.document || {};
      const docText = doc.text || "";
      const rowId = forcedRowId || createRowId(entry, rowIndex);
      const segments = Array.isArray(doc.segments) ? doc.segments : [];
      const persons = Array.isArray(doc.persons) ? doc.persons : [];
      const locations = Array.isArray(doc.locations) ? doc.locations : [];
      const terms = Array.isArray(doc.terms) ? doc.terms : [];
      const dates = Array.isArray(doc.dates) ? doc.dates : [];

      const locationsById = Object.fromEntries(locations.map((loc) => [loc.id, loc]));
      const personsById = Object.fromEntries(persons.map((per) => [per.id, per]));
      const segmentsById = Object.fromEntries(segments.map((seg) => [seg.id, seg]));

      const locationItems = uniqBy(locations.map((loc, index) => {
        const key = `${rowId}:location:${index}`;
        const name = locationDisplayName(loc, docText);
        const parentLocation = loc.parent && locationsById[loc.parent] ? locationsById[loc.parent] : null;
        const parentName = parentLocation ? previewEntityName(locationDisplayName(parentLocation, docText)) : "";
        const childLocations = (loc.children || []).map((id) => locationsById[id]).filter(Boolean);
        const children = childLocations.map((child) => previewEntityName(locationDisplayName(child, docText)));
        const aliases = mentionTexts(loc.mentions, docText);
        const mapQuery = [name, parentName].filter(Boolean).join(", ");
        return {
          key,
          kind: "location",
          id: loc.id || key,
          name,
          summary: name,
          type: loc.type || "",
          parentId: loc.parent || "",
          parentName,
          parentKey: parentLocation ? `${rowId}:location:${locations.findIndex((x) => x === parentLocation)}` : "",
          childIds: loc.children || [],
          childNames: children,
          childLinks: childLocations.map((child) => ({ key: `${rowId}:location:${locations.findIndex((x) => x === child)}`, label: previewEntityName(locationDisplayName(child, docText)) })),
          aliases,
          mentions: aliases,
          mapUrl: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(mapQuery || name)}`,
          mapEmbedUrl: `https://maps.google.com/maps?q=${encodeURIComponent(mapQuery || name)}&z=6&output=embed`,
          geocodeQuery: mapQuery || name,
          raw: loc,
        };
      }), (item) => item.id || item.name);

      const personItemsAll = uniqBy(persons.map((per, index) => {
        const key = `${rowId}:person:${index}`;
        const name = personDisplayName(per, docText);
        const residenceLoc = per.residence && locationsById[per.residence] ? locationsById[per.residence] : null;
        const parentPerson = per.parent && personsById[per.parent] ? personsById[per.parent] : null;
        const children = (per.children || []).map((id) => personsById[id]).filter(Boolean);
        const aliases = mentionTexts(per.mentions, docText);
        return {
          key,
          kind: "person",
          id: per.id || key,
          name,
          summary: name,
          type: per.type || "",
          role: per.role || "",
          parentId: per.parent || "",
          parentName: parentPerson ? previewEntityName(personDisplayName(parentPerson, docText)) : "",
          childIds: per.children || [],
          childNames: children.map((child) => personDisplayName(child, docText)),
          childLinks: children.map((child) => ({ key: `${rowId}:person:${persons.findIndex((x) => x === child)}`, label: previewEntityName(personDisplayName(child, docText)) })),
          residenceId: per.residence || "",
          residenceName: residenceLoc ? previewEntityName(locationDisplayName(residenceLoc, docText)) : "",
          residenceKey: residenceLoc ? `${rowId}:location:${locations.findIndex((x) => x === residenceLoc)}` : "",
          parentKey: parentPerson ? `${rowId}:person:${persons.findIndex((x) => x === parentPerson)}` : "",
          aliases,
          mentions: aliases,
          raw: per,
        };
      }), (item) => item.id || item.name);

      for (const locationItem of locationItems) {
        locationItem.residentLinks = uniqBy(
          personItemsAll
            .filter((person) => person.residenceKey && person.residenceKey === locationItem.key)
            .map((person) => ({ key: person.key, label: previewEntityName(person.name) })),
          (entry) => entry.key
        );
      }

      const partyItems = personItemsAll.filter((item) => item.role && PARTY_ROLE_SET.has(item.role));
      const displayPartyItems = partyItems.length ? partyItems : personItemsAll.filter((item) => item.role !== "non_party");

      const termItems = uniqBy(terms.map((term, index) => {
        const key = `${rowId}:term:${index}`;
        return {
          key,
          kind: "term",
          id: term.id || key,
          name: termDisplayName(term, docText),
          summary: termDisplayName(term, docText),
          meaning: decodeSpanSafe(term.meaning, docText),
          aliases: mentionTexts(term.mentions, docText),
          mentions: mentionTexts(term.mentions, docText),
          raw: term,
        };
      }), (item) => item.id || item.name);

      const signatureItems = uniqBy(
        segments
          .filter((seg) => String(seg.type || "").toLowerCase() === "signature")
          .map((seg, index) => {
            const key = `${rowId}:signature:${index}`;
            const parentSegment = seg.parent && segmentsById[seg.parent] ? segmentsById[seg.parent] : null;
            const childSegments = (seg.children || []).map((id) => segmentsById[id]).filter(Boolean);
            const label = signatureLabel(seg, docText);
            const aliases = uniqStrings([decodeSpanSafe(seg.span, docText), decodeSpanSafe(seg.title, docText), decodeSpanSafe(seg.code, docText)].filter(Boolean));
            return {
              key,
              kind: "signature",
              id: seg.id || key,
              name: label,
              summary: label,
              segmentKind: seg.kind || "",
              segmentType: seg.type || "",
              category: seg.category || "",
              level: typeof seg.level === "number" ? seg.level : "",
              parentId: seg.parent || "",
              parentName: parentSegment ? signatureLabel(parentSegment, docText) : "",
              childIds: seg.children || [],
              childNames: childSegments.map((child) => signatureLabel(child, docText)),
              childLinks: childSegments.map((child) => ({ key: `${rowId}:signature:${segments.filter((s) => String(s.type || "").toLowerCase() === "signature").findIndex((s) => s === child)}`, label: signatureLabel(child, docText) })).filter((x) => !x.key.endsWith(':-1')),
              parentKey: parentSegment && segments.filter((s) => String(s.type || "").toLowerCase() === "signature").findIndex((s) => s === parentSegment) >= 0 ? `${rowId}:signature:${segments.filter((s) => String(s.type || "").toLowerCase() === "signature").findIndex((s) => s === parentSegment)}` : "",
              typeName: decodeSpanSafe(seg.type_name, docText),
              code: decodeSpanSafe(seg.code, docText),
              title: decodeSpanSafe(seg.title, docText),
              spanText: decodeSpanSafe(seg.span, docText),
              spanStart: seg.span && typeof seg.span.start === "number" ? seg.span.start : "",
              spanEnd: seg.span && typeof seg.span.end === "number" ? seg.span.end : "",
              aliases,
              mentions: aliases,
              raw: seg,
            };
          }),
        (item) => item.id || item.name
      );

      const dateItems = uniqBy(dates.map((date, index) => {
        const key = `${rowId}:date:${index}`;
        const linkedPerson = date.person && personsById[date.person] ? personsById[date.person] : null;
        const aliases = mentionTexts(date.mentions, docText);
        return {
          key,
          kind: "date",
          id: `${date.value || "date"}:${date.type || ""}:${date.person || ""}:${index}`,
          name: formatIsoDate(date.value),
          summary: formatIsoDate(date.value),
          value: date.value || "",
          displayValue: formatIsoDate(date.value),
          type: date.type || "",
          personId: date.person || "",
          personName: linkedPerson ? previewEntityName(personDisplayName(linkedPerson, docText)) : "",
          personKey: linkedPerson ? `${rowId}:person:${persons.findIndex((x) => x === linkedPerson)}` : "",
          aliases: [],
          mentions: aliases,
          firstMention: aliases[0] || "",
          raw: date,
        };
      }), (item) => `${item.value}|${item.type}|${item.personId}|${item.firstMention}`);

      const row = {
        rowId,
        doc_id: entry.doc_id || entry.file_id || "",
        ilgs_doc_id: entry.ilgs_doc_id || doc.id || "",
        file_name: entry.file_name || `Document ${rowIndex + 1}`,
        document: doc,
        documentType: doc.type || "",
        jurisdiction: doc.jurisdiction || "",
        title: decodeSpanSafe(doc.title, docText),
        subtitle: decodeSpanSafe(doc.subtitle, docText),
        customColumnData: {},
        customColumnErrors: {},
        entities: {
          persons: personItemsAll,
          parties: personItemsAll,
          locations: locationItems,
          terms: termItems,
          signatures: signatureItems,
          dates: dateItems,
        },
        entityById: new Map(),
      };

      for (const item of [...personItemsAll, ...locationItems, ...termItems, ...signatureItems]) {
        state.entityIndex.set(item.key, { rowId, row, item });
      }

      for (const item of personItemsAll) {
        if (item.id) row.entityById.set(item.id, { collection: "parties", key: item.key, item });
      }
      for (const item of locationItems) {
        if (item.id) row.entityById.set(item.id, { collection: "locations", key: item.key, item });
      }
      for (const item of termItems) {
        if (item.id) row.entityById.set(item.id, { collection: "terms", key: item.key, item });
      }
      for (const group of getDateGroups(row)) {
        for (const item of group.items || []) {
          if (item.id) row.entityById.set(item.id, { collection: "dates", key: group.key, item: group, sourceItem: item });
        }
      }

      return row;
    }

    function deriveRowsFromPayload(payload, startIndex = 0) {
      const entries = Array.isArray(payload) ? payload : [payload];
      return entries.map((entry, index) => buildRow(entry, startIndex + index, createRowId(entry, startIndex + index)));
    }

    function parseServerPayload(rawText) {
      const content = String(rawText || "").replace(/^\uFEFF/, "").trim();
      if (!content) return [];
      try { return deriveRowsFromPayload(JSON.parse(content)); } catch (_) {}
      const lines = content.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
      const parsed = [];
      for (const line of lines) {
        try {
          parsed.push(JSON.parse(line));
        } catch (_) {
          throw new Error(`Server returned invalid NDJSON. First bad line starts with: ${line.slice(0, 220)}`);
        }
      }
      return deriveRowsFromPayload(parsed);
    }

    function getRowById(rowId) {
      return state.rows.find((row) => row.rowId === rowId) || null;
    }

    function getCellItems(row, collection) {
      if (!row) return [];
      if (collection === "parties") return row.entities.parties || [];
      if (collection === "locations") return row.entities.locations || [];
      if (collection === "terms") return row.entities.terms || [];
      if (collection === "signatures") return row.entities.signatures || [];
      if (collection === "dates") return getDateGroups(row);
      return [];
    }


    function getCustomEntityId(value) {
      if (typeof value === "string") return value;
      if (value && typeof value === "object") return value.entity_id || value.entityId || value.id || "";
      return "";
    }

    function getCustomEntityRef(row, value) {
      const entityId = getCustomEntityId(value);
      return entityId && row?.entityById ? (row.entityById.get(entityId) || null) : null;
    }


    function getCustomColumnById(columnId) {
      return state.customColumns.find((column) => column.id === columnId) || null;
    }

    function isCustomPreviewCollection(collection) {
      return !!getCustomColumnById(collection);
    }

    function getPreviewTabs() {
      return [
        ...BASE_PREVIEW_TABS,
        ...state.customColumns.map((column) => ({
          key: column.id,
          label: column.label,
          colType: column.colType,
          isCustom: true,
        })),
      ];
    }

    function getPreviewTabLabel(collection) {
      return getPreviewTabs().find((tab) => tab.key === collection)?.label || collection;
    }
    function getCustomColumnQuery(columnId) {
      const column = getCustomColumnById(columnId);
      return normalizeWhitespace(column?.query || column?.label || "");
    }

    function getSegmentById(row, segmentId) {
      const segments = Array.isArray(row?.document?.segments) ? row.document.segments : [];
      return segments.find((segment) => segment?.id === segmentId) || null;
    }

    function firstWordFromText(value) {
      const text = normalizeWhitespace(value);
      return text ? (text.split(/\s+/)[0] || text) : "Span";
    }

    function getCustomSpanTitle(row, segmentId, fallbackText = "") {
      const docText = row?.document?.text || "";
      const segment = getSegmentById(row, segmentId);
      if (!segment) return truncate(normalizeWhitespace(fallbackText) || firstWordFromText(fallbackText), 90);
      const parts = [
        decodeSpanSafe(segment.type_name, docText),
        decodeSpanSafe(segment.code, docText),
        decodeSpanSafe(segment.title, docText),
      ].filter(Boolean).map(normalizeWhitespace);
      if (parts.length) return truncate(parts.join(" "), 90);
      const spanText = decodeSpanSafe(segment.span, docText) || fallbackText;
      return truncate(normalizeWhitespace(spanText) || firstWordFromText(fallbackText), 90);
    }

    function getCustomSpanText(row, raw, metadata = {}) {
      const start = metadata?.start;
      const end = metadata?.end;
      if (row?.document?.text && typeof start === "number" && typeof end === "number") {
        const decoded = decodeSpanSafe({ start, end }, row.document.text);
        if (decoded) return normalizeWhitespace(decoded);
      }
      return normalizeWhitespace(raw?.text || raw?.label || raw?.name || raw?.summary || "");
    }

    function truncateWords(value, maxWords = 12, maxChars = 110) {
      const text = normalizeWhitespace(value);
      if (!text) return "";
      const words = text.split(/\s+/).filter(Boolean);
      if (words.length <= maxWords && text.length <= maxChars) return text;
      const wordLimited = words.slice(0, maxWords).join(" ");
      const base = wordLimited.length > maxChars ? wordLimited.slice(0, maxChars).trimEnd() : wordLimited;
      return `${base.replace(/[\s.,;:!?-]+$/, "")}…`;
    }

    function getCustomSpanDisplayName(row, raw, metadata = {}) {
      const fullText = getCustomSpanText(row, raw, metadata);
      if (fullText) return truncateWords(fullText, 12, 110);
      return "Span";
    }

    function appendDetailGridBlock(detailHtml, blockHtml) {
      if (!blockHtml || !detailHtml) return detailHtml;
      return /<div class="detail-grid">/.test(detailHtml)
        ? detailHtml.replace(/<\/div>\s*$/, `${blockHtml}</div>`)
        : `${detailHtml}${blockHtml}`;
    }

    function renderCustomColumnContextCard(column) {
      const query = normalizeWhitespace(column?.query || column?.label || "");
      if (!query) return "";
      return maybeRenderCard("Query", renderMetaGrid([["Query", escapeHtml(query)]]));
    }

    function normalizeCustomSpanItem(row, column, value, index) {
      const raw = value && typeof value === "object" ? value : {};
      const metadata = raw.metadata && typeof raw.metadata === "object" ? raw.metadata : {};
      const hasSpan = typeof metadata.start === "number" && typeof metadata.end === "number";
      const span = hasSpan ? { start: metadata.start, end: metadata.end } : null;
      const segmentId = metadata.segment_id || `${column.id}:${index}`;
      const segmentText = getCustomSpanText(row, raw, metadata);
      const displayName = getCustomSpanDisplayName(row, raw, metadata);
      return {
        key: `${column.id}:span:${index}`,
        kind: "custom-span",
        id: segmentId,
        name: displayName || `Span ${index + 1}`,
        title: displayName || `Span ${index + 1}`,
        segmentTitle: displayName || `Span ${index + 1}`,
        summary: "",
        segmentText: segmentText || "",
        span,
        raw,
        customColumnId: column.id,
        customColumnLabel: column.label,
        customColumnQuery: normalizeWhitespace(column?.query || column?.label || ""),
      };
    }

    function getCustomPreviewItems(row, collection) {
      const column = getCustomColumnById(collection);
      if (!row || !column) return [];
      const values = Array.isArray(row?.customColumnData?.[column.id]) ? row.customColumnData[column.id] : [];
      if (column.colType === "entity") {
        return uniqBy(values.map((value, index) => {
          const ref = getCustomEntityRef(row, value);
          if (ref?.item) return {
            ...ref.item,
            customColumnId: column.id,
            customColumnLabel: column.label,
            customColumnQuery: normalizeWhitespace(column?.query || column?.label || ""),
          };
          const entityId = getCustomEntityId(value);
          return entityId ? {
            key: `${column.id}:entity:${index}`,
            kind: "custom-entity",
            id: entityId,
            name: entityId,
            summary: column.label,
            customColumnId: column.id,
            customColumnLabel: column.label,
            customColumnQuery: normalizeWhitespace(column?.query || column?.label || ""),
          } : null;
        }).filter(Boolean), (item) => item.id || item.key);
      }
      return values.map((value, index) => normalizeCustomSpanItem(row, column, value, index));
    }

    function chipClassForCollection(collection) {
      if (collection === "parties") return "chip-person";
      if (collection === "locations") return "chip-location";
      if (collection === "terms") return "chip-term";
      if (collection === "dates") return "chip-date";
      if (collection === "signatures") return "chip-signature";
      return "";
    }


    function getViewerTargetForPreviewItem(collection, item) {
      if (!item) return { enabled: false, collection: "", key: "" };
      if (!isCustomPreviewCollection(collection)) return { enabled: true, collection, key: item.key || "" };
      if (item.items) return { enabled: true, collection: "dates", key: item.key || "" };
      if (item.kind === "person") return { enabled: true, collection: "parties", key: item.key || "" };
      if (item.kind === "location") return { enabled: true, collection: "locations", key: item.key || "" };
      if (item.kind === "term") return { enabled: true, collection: "terms", key: item.key || "" };
      if (item.kind === "signature") return { enabled: true, collection: "signatures", key: item.key || "" };
      if (item.kind === "custom-span") return { enabled: true, collection, key: item.key || "" };
      return { enabled: false, collection: "", key: "" };
    }

    function getCustomColumnLabelValue(item, row, column = null) {
      if (column?.colType === "entity") {
        const ref = getCustomEntityRef(row, item);
        if (ref?.item) return previewEntityName(ref.item) || ref.item.displayValue || ref.item.name || ref.item.id || getCustomEntityId(item);
        const entityId = getCustomEntityId(item);
        if (entityId) return entityId;
      }
      if (column?.colType === "span") {
        const metadata = item?.metadata || {};
        if (row?.document?.text && typeof metadata.start === "number" && typeof metadata.end === "number") {
          const fromSpan = decodeSpanSafe({ start: metadata.start, end: metadata.end }, row.document.text);
          if (fromSpan) return fromSpan;
        }
      }
      if (item == null) return "";
      if (typeof item === "string") return item;
      if (typeof item !== "object") return String(item);
      const direct = item.text || item.label || item.name || item.value || item.summary || item.entity || "";
      if (direct) return normalizeWhitespace(String(direct));
      try {
        return normalizeWhitespace(JSON.stringify(item));
      } catch (_) {
        return "";
      }
    }

    function getCustomEntityRelations(row, entityId) {
      if (!row || !entityId) return [];
      return state.customColumns.filter((column) => {
        if (column.colType !== "entity") return false;
        const items = Array.isArray(row?.customColumnData?.[column.id]) ? row.customColumnData[column.id] : [];
        return items.some((item) => getCustomEntityId(item) === entityId);
      });
    }

    function renderCustomRelationsSection(row, item) {
      const matches = getCustomEntityRelations(row, item?.id || "");
      if (!matches.length) return "";
      return `<div class="entity-section"><label class="preview-section-label">Attributes and relations</label><div class="meta-link-list">${matches.map((column) => `<div>${escapeHtml(column.label || column.query || "")}</div>`).join("")}</div></div>`;
    }

    function renderCustomRelationsForDateGroup(row, group) {
      const ids = uniqStrings((group?.items || []).map((item) => item.id).filter(Boolean));
      const matches = state.customColumns.filter((column) => {
        if (column.colType !== "entity") return false;
        const items = Array.isArray(row?.customColumnData?.[column.id]) ? row.customColumnData[column.id] : [];
        return items.some((item) => ids.includes(getCustomEntityId(item)));
      });
      if (!matches.length) return "";
      return `<div class="entity-section" style="margin-top: 26px;"><label class="preview-section-label">Attributes and relations</label><div class="meta-link-list">${matches.map((column) => `<div>${escapeHtml(column.label || column.query || "")}</div>`).join("")}</div></div>`;
    }

    function renderCustomColumnCell(row, column) {
      const items = getPreviewItems(row, column.id);
      const isProcessing = column.status === "processing";
      if (!items.length) {
        if (isProcessing) return '<span class="cell-empty">Processing…</span>';
        const errorText = row?.customColumnErrors?.[column.id] || "";
        return `<span class="cell-empty"${errorText ? ` title="${escapeHtml(errorText)}"` : ""}>—</span>`;
      }
      const visible = items.slice(0, 2);
      const hiddenCount = Math.max(0, items.length - visible.length);
      return `<div class="cell-content"><div class="custom-chip-stack">${visible.map((item) => {
        const fullSpanText = column.colType === "span"
          ? (item?.segmentText || getCustomColumnLabelValue(item?.raw || item, row, column))
          : "";
        const rawValue = column.colType === "span"
          ? (item?.name || getCustomSpanDisplayName(row, item?.raw || item, item?.raw?.metadata || item?.metadata || {}))
          : getCustomColumnLabelValue(item, row, column);
        const label = column.colType === "span"
          ? (rawValue || "Span")
          : truncate(rawValue || "Result", 110);
        const title = column.colType === "span"
          ? (fullSpanText || rawValue || "Span")
          : (rawValue || "Result");
        const chipClass = column.colType === "entity"
          ? chipClassForCollection(item.items ? "dates" : (item.kind === "person" ? "parties" : item.kind === "location" ? "locations" : item.kind === "term" ? "terms" : item.kind === "date" ? "dates" : item.kind === "signature" ? "signatures" : ""))
          : "chip-span";
        return `<button class="custom-chip custom-chip-button ${chipClass}" type="button" title="${escapeHtml(column.colType === "entity" ? (getEntityTooltipText(item) || title) : title)}" data-action="open-custom-column-item" data-row-id="${escapeHtml(row.rowId)}" data-collection="${escapeHtml(column.id)}" data-key="${escapeHtml(item.key)}">${escapeHtml(label)}</button>`;
      }).join("")}${hiddenCount ? `<button class="entity-more" type="button" data-action="open-preview" data-row-id="${escapeHtml(row.rowId)}" data-collection="${escapeHtml(column.id)}">+${hiddenCount} more</button>` : ""}</div></div>`;
    }

    function getPreviewItems(row, collection) {
      if (!row) return [];
      if (collection === "parties") return row.entities.parties || [];
      if (collection === "locations") return row.entities.locations || [];
      if (collection === "terms") return row.entities.terms || [];
      if (collection === "signatures") return row.entities.signatures || [];
      if (collection === "dates") return getDateGroups(row);
      if (isCustomPreviewCollection(collection)) return getCustomPreviewItems(row, collection);
      return [];
    }

    function getPreviewSearchTerm(collection) {
      return normalizeWhitespace(state.preview?.searchTerms?.[collection] || "");
    }

    function getFilteredPreviewItems(row, collection) {
      const items = getPreviewItems(row, collection);
      const search = getPreviewSearchTerm(collection).toLowerCase();
      if (!search) return items;
      return items.filter((item) => {
        const haystack = [
          item.name || "",
          item.summary || "",
          item.id || "",
          buildEntitySubtitle(item) || "",
          item.displayValue || "",
          ...(item.eventLabels || []),
          ...(item.mentions || []),
          ...(item.aliases || []),
        ].join(" ").toLowerCase();
        return haystack.includes(search);
      });
    }

    function entityRef(rowId, collection, key, label) {
      if (!rowId || !collection || !key || !label) return "";
      const item = getItemByKey(key);
      const tooltip = item ? getEntityTooltipText(item) : "";
      const displayLabel = previewEntityName(label, collection === "dates" ? "date" : "");
      return `<button class="meta-link" type="button" title="${escapeHtml(tooltip)}" data-action="navigate-entity" data-row-id="${escapeHtml(rowId)}" data-collection="${escapeHtml(collection)}" data-key="${escapeHtml(key)}">${escapeHtml(displayLabel)}</button>`;
    }

    function entityRefList(rowId, collection, items) {
      const safeItems = (items || []).filter((item) => item && item.key && item.label);
      if (!safeItems.length) return "";
      return `<div class="meta-link-list">${safeItems.map((item) => `<div>${entityRef(rowId, collection, item.key, item.label)}</div>`).join("")}</div>`;
    }

    function normalizeMetaValue(value) {
      if (Array.isArray(value)) return value.length ? value : "";
      return value == null ? "" : value;
    }

    function hasMetaValue(value) {
      const normalized = normalizeMetaValue(value);
      if (Array.isArray(normalized)) return normalized.length > 0;
      return String(normalized).trim() !== "";
    }

    function getCollectionItems(row, collection) {
      return getPreviewItems(row, collection);
    }

    function renderCellChips(row, collectionKey) {
      const items = getCellItems(row, collectionKey);
      if (!items.length) return '<span class="cell-empty">—</span>';
      const maxVisible = 2;
      const visible = items.slice(0, maxVisible);
      const hiddenCount = Math.max(0, items.length - visible.length);
      const chipClass = chipClassForCollection(collectionKey);

      return `<div class="cell-content"><div class="chip-stack">${
        visible.map((item) => `
          <button class="entity-chip ${chipClass}" type="button"
            data-action="open-preview"
            data-row-id="${escapeHtml(row.rowId)}"
            data-collection="${escapeHtml(collectionKey)}"
            data-key="${escapeHtml(item.key)}">
            ${escapeHtml(collectionKey === "dates" ? item.displayValue : (previewEntityName(item) || item.summary || item.name || item.id))}
          </button>
        `).join("")
      }${
        hiddenCount ? `
          <button class="entity-more" type="button"
            data-action="open-preview"
            data-row-id="${escapeHtml(row.rowId)}"
            data-collection="${escapeHtml(collectionKey)}">
            +${hiddenCount} more
          </button>` : ""
      }</div></div>`;
    }

    function getAllColumns() {
      return [
        ...state.defaultColumns.map((col) => ({ ...col, columnType: "default", id: col.key })),
        ...state.customColumns.map((col) => ({ ...col, columnType: "custom" })),
      ];
    }


    function buildRowSearchText(row) {
      return [
        row.file_name || "",
        row.title || "",
        row.documentType || "",
        ...(row.entities?.persons || []).flatMap((item) => [item.name, item.summary, item.role, item.type, ...(item.aliases || [])]),
        ...(row.entities?.locations || []).flatMap((item) => [item.name, item.summary, item.type, item.parentName, ...(item.aliases || [])]),
        ...(row.entities?.terms || []).flatMap((item) => [item.name, item.summary, item.meaning]),
        ...(row.entities?.signatures || []).flatMap((item) => [item.name, item.summary, item.segmentType, item.title]),
        ...(row.entities?.dates || []).flatMap((item) => [item.displayValue, item.value, ...(item.eventLabels || [])]),
        ...state.customColumns.flatMap((column) => (Array.isArray(row?.customColumnData?.[column.id]) ? row.customColumnData[column.id] : []).map((item) => getCustomColumnLabelValue(item, row, column))),
      ].filter(Boolean).join(" ").toLowerCase();
    }

    function getSortValueForRow(row, columnId) {
      if (!row || !columnId) return "";
      if (columnId === "file_name") return normalizeWhitespace(row.file_name || "").toLowerCase();
      if (columnId === "parties") return getPreviewItems(row, "parties").map((item) => previewEntityName(item)).join(" | ").toLowerCase();
      if (columnId === "locations") return getPreviewItems(row, "locations").map((item) => previewEntityName(item)).join(" | ").toLowerCase();
      if (columnId === "terms") return getPreviewItems(row, "terms").map((item) => previewEntityName(item)).join(" | ").toLowerCase();
      if (columnId === "signatures") return getPreviewItems(row, "signatures").map((item) => previewEntityName(item)).join(" | ").toLowerCase();
      if (columnId === "dates") {
        const groups = getDateGroups(row);
        const first = groups[0] || null;
        return normalizeWhitespace(first?.value || first?.displayValue || "").toLowerCase();
      }
      const customColumn = getCustomColumnById(columnId);
      if (customColumn) {
        return (Array.isArray(row?.customColumnData?.[columnId]) ? row.customColumnData[columnId] : [])
          .map((item) => getCustomColumnLabelValue(item, row, customColumn))
          .filter(Boolean)
          .join(" | ")
          .toLowerCase();
      }
      return "";
    }

    function compareSortValues(a, b) {
      return String(a == null ? "" : a).localeCompare(String(b == null ? "" : b), undefined, { numeric: true, sensitivity: "base" });
    }

    function getVisibleRows() {
      const query = normalizeWhitespace(state.tableSearch || "").toLowerCase();
      let rows = query ? state.rows.filter((row) => buildRowSearchText(row).includes(query)) : [...state.rows];
      const sortColumnId = state.sort?.columnId || "";
      if (sortColumnId) {
        const direction = state.sort?.direction === "desc" ? -1 : 1;
        rows.sort((a, b) => {
          const cmp = compareSortValues(getSortValueForRow(a, sortColumnId), getSortValueForRow(b, sortColumnId));
          if (cmp !== 0) return cmp * direction;
          return state.rows.indexOf(a) - state.rows.indexOf(b);
        });
      }
      return rows;
    }


function renderColGroup() {
  const allColumns = getAllColumns();
  elements.colGroup.innerHTML = `${allColumns.map((column) => `<col data-col-id="${escapeHtml(column.id)}" style="width:${column.width}px; min-width:${column.width}px;">`).join("")}<col style="width:52px; min-width:52px;">`;
}


    function getViewportTableWidth() {
      const shellWidth = elements.sheetShell ? elements.sheetShell.clientWidth : window.innerWidth;
      return Math.max(0, shellWidth - 8);
    }

    function getAddColumnWidth() {
      return 52;
    }

    function getTableColumns() {
      return [
        ...state.defaultColumns.map((col) => ({ ...col, columnType: "default", id: col.key })),
        ...state.customColumns.map((col) => ({ ...col, columnType: "custom" })),
      ];
    }

    function getComputedTableColumns() {
      const columns = getTableColumns().map((col) => ({ ...col }));
      const addWidth = getAddColumnWidth();
      const viewportWidth = getViewportTableWidth();
      const naturalTotal = columns.reduce((sum, col) => sum + (col.width || 0), 0) + addWidth;

      if (columns.length && naturalTotal < viewportWidth) {
        const extra = viewportWidth - naturalTotal;
        const baseWidths = columns.map((col) => Math.max(1, col.width || 0));
        const baseTotal = baseWidths.reduce((a, b) => a + b, 0);
        let distributed = 0;
        columns.forEach((col, idx) => {
          const share = idx === columns.length - 1
            ? (extra - distributed)
            : Math.floor((extra * baseWidths[idx]) / baseTotal);
          col.computedWidth = (col.width || 0) + share;
          distributed += share;
        });
        return { columns, fitsViewport: true };
      }

      columns.forEach((col) => {
        col.computedWidth = col.width || 0;
      });
      return { columns, fitsViewport: false };
    }

    
    function viewerGetRow() {
      return state.viewer ? getRowById(state.viewer.rowId) : null;
    }

    function viewerGetItems(row, collection) {
      if (!row) return [];
      return collection === "dates" ? getDateGroups(row) : getPreviewItems(row, collection);
    }

    function viewerFilterItems(items) {
      const q = normalizeWhitespace(state.viewer?.search || "").toLowerCase();
      if (!q) return items || [];
      return (items || []).filter((item) => {
        const haystack = [
          item.name || "",
          item.displayValue || "",
          item.summary || "",
          item.id || "",
          buildEntitySubtitle(item) || "",
          ...(item.aliases || []),
          ...(item.mentions || []),
          ...(item.eventLabels || []),
        ].join(" ").toLowerCase();
        return haystack.includes(q);
      });
    }

    function viewerGetFilteredItems(row) {
      return viewerFilterItems(viewerGetItems(row, state.viewer?.currentTab || "parties"));
    }

    function viewerGetCurrentItem(row) {
      const collection = state.viewer?.currentTab || "parties";
      const items = viewerGetItems(row, collection);
      let selectedKey = state.viewer?.selectedKey || "";
      if (!selectedKey && items[0]) {
        selectedKey = items[0].key;
        if (state.viewer) state.viewer.selectedKey = selectedKey;
      }
      const selected = items.find((item) => item.key === selectedKey) || items[0] || null;
      if (selected && state.viewer) state.viewer.selectedKey = selected.key;
      return selected;
    }

    function viewerGetSegmentLabel(seg, docText) {
      const parts = [
        decodeSpanSafe(seg.type_name, docText),
        decodeSpanSafe(seg.code, docText),
        decodeSpanSafe(seg.title, docText),
      ].filter(Boolean);
      if (parts.length) return parts.join(" ");
      const snippet = decodeSpanSafe(seg.span, docText);
      if (snippet) return snippet.length > 90 ? `${snippet.slice(0, 89)}…` : snippet;
      return seg.id || "Segment";
    }

    function viewerBuildSegmentTree(row) {
      const doc = row?.document || {};
      const segments = Array.isArray(doc.segments) ? doc.segments : [];
      const byId = new Map();
      segments.forEach((seg) => {
        byId.set(seg.id, {
          id: seg.id,
          label: viewerGetSegmentLabel(seg, doc.text || ""),
          start: typeof seg?.span?.start === "number" ? seg.span.start : 0,
          end: typeof seg?.span?.end === "number" ? seg.span.end : 0,
          kind: seg.kind || "",
          children: [],
        });
      });
      const roots = [];
      segments.forEach((seg) => {
        const node = byId.get(seg.id);
        if (!node) return;
        if (seg.parent && byId.has(seg.parent)) byId.get(seg.parent).children.push(node);
        else roots.push(node);
      });
      const sortTree = (nodes) => (nodes || [])
        .sort((a, b) => a.start - b.start)
        .map((node) => ({ ...node, children: sortTree(node.children) }));
      return sortTree(roots);
    }

    function viewerRenderTree(nodes, depth = 0) {
      return (nodes || []).map((node) => `
        <div class="viewer-tree-group">
          <button class="viewer-tree-item ${state.viewer?.activeSegmentStart === node.start ? "is-active" : ""}" type="button"
            data-action="viewer-select-segment"
            data-start="${node.start}"
            data-end="${node.end}"
            data-dbl-action="viewer-jump-segment"
            style="padding-left:${12 + depth * 14}px;">
            <span class="viewer-tree-title">
              <span class="viewer-tree-bullet"></span>
              <span class="viewer-tree-label">${escapeHtml(node.label)}</span>
            </span>
            <span class="viewer-tree-meta">${escapeHtml(titleCase(node.kind || ""))}</span>
          </button>
          ${node.children?.length ? `<div class="viewer-tree-children">${viewerRenderTree(node.children, depth + 1)}</div>` : ""}
        </div>
      `).join("");
    }

    function viewerBuildAnnotations(row) {
      const annotations = [];
      getPreviewTabs().forEach((tab) => {
        const items = viewerGetItems(row, tab.key);
        items.forEach((item) => {
          const spans = tab.key === "dates"
            ? getFocusSpansForDateGroup(item)
            : getFocusSpansForItem(tab.key, item);
          dedupeSpans(spans).forEach((span) => {
            annotations.push({
              collection: tab.key,
              key: item.key,
              label: item.name || item.displayValue || item.summary || item.id || tab.label,
              start: span.start,
              end: span.end,
            });
          });
        });
      });
      return annotations
        .filter((ann) => Number.isFinite(ann.start) && Number.isFinite(ann.end) && ann.end > ann.start)
        .sort((a, b) => (a.start - b.start) || (a.end - b.end));
    }

    function viewerBuildPieces(row) {
      const docText = row?.document?.text || "";
      const codePoints = getCodePoints(docText);
      const annotations = viewerBuildAnnotations(row);
      const boundaries = new Set([0, codePoints.length]);
      annotations.forEach((ann) => {
        boundaries.add(ann.start);
        boundaries.add(ann.end);
      });
      const sorted = [...boundaries].sort((a, b) => a - b);
      const pieces = [];
      for (let i = 0; i < sorted.length - 1; i += 1) {
        const start = sorted[i];
        const end = sorted[i + 1];
        if (end <= start) continue;
        const text = codePoints.slice(start, end).join("");
        const covering = annotations.filter((ann) => ann.start < end && ann.end > start);
        pieces.push({ start, end, text, covering });
      }
      return pieces;
    }

    
    function classifyViewerPiece(text) {
      const raw = String(text || "");
      const trimmed = raw.trim();
      const classes = [];
      if (!trimmed) return classes;

      const headingPatterns = [
        /^(section|article|clause|schedule|appendix|annex|part)\s+[a-z0-9.\-]+[:.]?/i,
        /^\d+(\.\d+)*\s+[A-Z]/,
        /^[A-Z][A-Z\s,&\-]{4,120}$/,
      ];
      if (headingPatterns.some((pattern) => pattern.test(trimmed))) classes.push("heading-piece");

      const quotePatterns = [
        /^["“”'‘’].+["“”'‘’]$/,
        /^>\s+/,
        /“[^”]+”/,
      ];
      if (quotePatterns.some((pattern) => pattern.test(trimmed))) classes.push("quote-piece");

      const xrefPatterns = [
        /\b(section|article|clause|schedule|appendix|annex|part)\s+[a-z0-9.\-]+\b/i,
        /\bsee\s+(section|article|clause)\b/i,
      ];
      if (xrefPatterns.some((pattern) => pattern.test(trimmed))) classes.push("style-xref");

      return classes;
    }

function viewerRenderDocument(row) {
      const pieces = viewerBuildPieces(row);
      const selectedKey = state.viewer?.selectedKey || "";
      return pieces.map((piece) => {
        const selected = selectedKey && piece.covering.some((ann) => ann.key === selectedKey);
        const primary = selected
          ? piece.covering.find((ann) => ann.key === selectedKey)
          : (piece.covering[0] || null);
        const classes = ["viewer-piece", ...classifyViewerPiece(piece.text)];
        if (primary) {
          classes.push("annotated");
          classes.push(primary.collection === "parties" ? "person" : primary.collection.slice(0, -1));
        }
        const activeRange = state.viewer?.activeSegmentRange || null;
        const inActiveRange = activeRange && piece.start >= activeRange.start && piece.end <= activeRange.end;
        if (selected || inActiveRange) classes.push("selected");
        const attrs = [`data-start="${piece.start}"`, `data-end="${piece.end}"`];
        if (primary) {
          attrs.push('data-action="viewer-piece-select"');
          attrs.push(`data-key="${escapeHtml(primary.key)}"`);
          attrs.push(`data-collection="${escapeHtml(primary.collection)}"`);
          attrs.push(`title="${escapeHtml(primary.tooltip || piece.covering.map((ann) => ann.label).join(" · "))}"`);
        }
        return `<span class="${classes.join(" ")}" ${attrs.join(" ")}>${escapeHtml(piece.text)}</span>`;
      }).join("");
    }

    function viewerRenderTabs(row) {
      return getPreviewTabs().map((tab) => {
        const count = viewerGetItems(row, tab.key).length;
        return `<button class="viewer-tab-btn ${tab.key === state.viewer?.currentTab ? "is-active" : ""}" type="button" title="${escapeHtml(tab.label)} (${count})" data-action="viewer-switch-tab" data-tab="${escapeHtml(tab.key)}"><span class="viewer-icon">${viewerTabIcon(tab.key)}</span><span class="viewer-label">${escapeHtml(tab.label)}</span><span class="viewer-count">${count}</span></button>`;
      }).join("");
    }

    function viewerBuildSubtitle(item, collection) {
      if (!item) return "";
      if (collection === "parties") return [item.type ? titleCase(item.type) : "", item.role ? titleCase(item.role) : ""].filter(Boolean).join(" · ");
      if (collection === "locations") return [item.type ? titleCase(item.type) : "", item.parentName ? `Parent: ${item.parentName}` : ""].filter(Boolean).join(" · ");
      if (collection === "terms") return item.meaning || "Defined term";
      if (collection === "signatures") return [item.segmentKind ? titleCase(item.segmentKind) : "", item.title || ""].filter(Boolean).join(" · ");
      if (collection === "dates") return [item.displayValue || formatIsoDate(item.value), ...(item.eventLabels || [])].filter(Boolean).join(" · ");
      return "";
    }

    function viewerRenderEntityList(row) {
      const items = viewerGetFilteredItems(row);
      if (!items.length) return `<div class="empty-panel">No matching items found.</div>`;
      return items.map((item) => `
        <button class="viewer-entity-item ${item.key === state.viewer?.selectedKey ? "is-selected" : ""}" type="button" data-action="viewer-select-entity" data-dbl-action="viewer-jump-to-entity" data-key="${escapeHtml(item.key)}">
          <div class="viewer-entity-name">${escapeHtml(item.name || item.displayValue || item.summary || item.id)}</div>
          <div class="viewer-entity-subtitle">${escapeHtml(viewerBuildSubtitle(item, state.viewer?.currentTab || "parties"))}</div>
        </button>
      `).join("");
    }

    function viewerRenderDetails(row) {
      const collection = state.viewer?.currentTab || "parties";
      const item = viewerGetCurrentItem(row);
      if (!item) return `<div class="empty-panel">Select an entity to inspect its metadata.</div>`;
      if (collection === "parties") return renderPersonDetail(row, item);
      if (collection === "locations") return renderLocationDetail(row, item);
      if (collection === "terms") return renderTermDetail(row, item);
      if (collection === "signatures") return renderSignatureDetail(row, item);
      if (collection === "dates") return renderDateDetail(row, item);
      if (isCustomPreviewCollection(collection)) {
        const customColumn = getCustomColumnById(collection);
        if (customColumn?.colType === "entity") {
          if (item?.items) return renderDateDetail(row, item);
          if (item?.kind === "person") return renderPersonDetail(row, item);
          if (item?.kind === "location") return renderLocationDetail(row, item);
          if (item?.kind === "term") return renderTermDetail(row, item);
          if (item?.kind === "signature") return renderSignatureDetail(row, item);
        }
        return renderCustomSpanDetail(row, item);
      }
      return `<div class="empty-panel">No details available.</div>`;
    }

    function viewerScrollToSelection() {
      const overlay = elements.overlay;
      if (!overlay) return;
      const target = overlay.querySelector(".viewer-piece.selected") || overlay.querySelector(".viewer-piece.annotated");
      if (target) target.scrollIntoView({ block: "center", behavior: "smooth" });
    }


    function buildInlineViewerOverlay(row) {
      const subtitle = normalizeWhitespace(row?.title || titleCase(row?.documentType || ""));
      return `
        <div class="overlay-backdrop" data-action="close-overlay"></div>

          <div class="viewer-header">

              <div class="viewer-header-title">${escapeHtml(row?.file_name || "ILGS viewer")}</div>
              ${subtitle ? `<div class="viewer-header-subtitle">${escapeHtml(subtitle)}</div>` : ""}
            </div>

          </div>
          <div class="viewer-frame-wrap">
            <div class="viewer-loading"><div class="viewer-loading-label">Loading document viewer…</div><div class="viewer-loading-bar" aria-hidden="true"><div class="viewer-loading-bar-fill"></div></div></div>
            <iframe class="viewer-iframe" referrerpolicy="no-referrer" style="display:none;"></iframe>
          </div>
        </div>
      `;
    }


function renderHeader() {
  const headers = getAllColumns().map((column) => {
    const classes = [
      column.key === "file_name" ? "file-col" : "",

    const sortControls = columnSupportsSort(column) ? `

        <button class="header-sort-button ${sortDescActive ? "is-active" : ""}" type="button" title="Sort descending" data-action="sort-column" data-column-id="${escapeHtml(column.id)}" data-direction="desc"><span>↓</span></button>

            : `<span class="header-label ${column.columnType === "custom" ? "is-renamable" : ""}" ${column.columnType === "custom" ? `title="${escapeHtml(column.query || column.label || "")}" data-action="start-rename-column" data-column-id="${escapeHtml(column.id)}"` : ""}>${escapeHtml(column.label)}</span>`}

    </th>

  renderColGroup();
}

    function renderTagList(values) {

    function renderCard(title, body, actionHtml = "", titleClass = "") {
      return `

      if (!visibleItems.length) return "";
      return `

function maybeRenderCard(title, body, actionHtml = "", titleClass = "") {
  return body && String(body).trim() ? renderCard(title, body, actionHtml, titleClass) : "";
}

function renderAliasesSection(item) {

function isOtherPartyItem(item) {
  const role = String(item?.role || "").toLowerCase();
  return Boolean(item && (item.parentKey || item.parentName || role === "non_party"));
}


function getEntityTooltipText(item) {
  if (!item) return "";
  if (item.kind === "term") return [previewEntityName(item) || "", item.meaning || ""].filter(Boolean).join(" — ");
  if (item.kind === "person") return [previewEntityName(item) || "", item.role ? `Role: ${titleCase(item.role)}` : "", item.type ? `Type: ${titleCase(item.type)}` : ""].filter(Boolean).join("\n");
  if (item.kind === "location") return [previewEntityName(item) || "", item.type ? `Type: ${titleCase(item.type)}` : ""].filter(Boolean).join("\n");
  if (item.kind === "date") return [item.displayValue || item.value || "", item.type ? `Type: ${titleCase(item.type)}` : "", item.personName ? `Person: ${item.personName}` : ""].filter(Boolean).join("\n");
  if (item.kind === "signature") return [previewEntityName(item) || "", item.segmentType ? `Type: ${titleCase(item.segmentType)}` : "", item.title || ""].filter(Boolean).join("\n");
  return item.name || item.summary || item.id || "";
}

function overlapSpan(a, b) {
  if (!a || !b) return null;
  const start = Math.max(a.start, b.start);
  const end = Math.min(a.end, b.end);
  return end > start ? { start, end } : null;
}

function getAnnotationsForBaseSpan(row, baseSpan, excludeKey = "") {
  const out = [];
  const collections = ["parties", "locations", "terms", "signatures"];
  for (const collection of collections) {
    const items = getPreviewItems(row, collection) || [];
    for (const item of items) {
      if (!item || item.key === excludeKey) continue;
      const spans = getFocusSpansForItem(collection, item);
      for (const span of spans) {
        const clipped = overlapSpan(baseSpan, span);
        if (!clipped) continue;
        out.push({
          collection,
          key: item.key,
          start: clipped.start,
          end: clipped.end,
          tooltip: getEntityTooltipText(item),
        });
      }
    }
  }
  for (const group of getDateGroups(row)) {
    for (const span of getFocusSpansForDateGroup(group)) {
      const clipped = overlapSpan(baseSpan, span);
      if (!clipped) continue;
      const item = group.items?.[0] || null;
      out.push({
        collection: "dates",
        key: group.key,
        start: clipped.start,
        end: clipped.end,
        tooltip: item ? getEntityTooltipText(item) : group.displayValue,
      });
    }
  }
  const seen = new Set();
  return out
    .filter((ann) => {
      const key = `${ann.collection}:${ann.key}:${ann.start}:${ann.end}`;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    })
    .sort((a, b) => a.start - b.start || b.end - a.end);
}

function annotationClassForCollection(collection) {
  if (collection === "parties") return "hl-person";
  if (collection === "locations") return "hl-location";
  if (collection === "terms") return "hl-term";
  if (collection === "signatures") return "hl-signature";
  if (collection === "dates") return "hl-date";
  return "";
}

function renderAnnotatedRawSpan(row, rawSpan, excludeKey = "") {
  const span = normalizeSpanObject(rawSpan);
  const text = String(row?.document?.text || "");
  if (!span || !text) return "";
  const cp = getCodePoints(text);
  const annotations = getAnnotationsForBaseSpan(row, span, excludeKey);
  if (!annotations.length) return `<div class="annotated-inline-wrap">${escapeHtml(cp.slice(span.start, span.end).join(""))}</div>`;

  const boundaries = new Set([span.start, span.end]);
  annotations.forEach((ann) => { boundaries.add(ann.start); boundaries.add(ann.end); });
  const sorted = [...boundaries].sort((a, b) => a - b);
  const parts = [];
  for (let i = 0; i < sorted.length - 1; i += 1) {
    const start = sorted[i];
    const end = sorted[i + 1];
    if (end <= start) continue;
    const segmentText = cp.slice(start, end).join("");
    const active = annotations.filter((ann) => ann.start < end && ann.end > start);
    if (!active.length) {
      parts.push(escapeHtml(segmentText));
      continue;
    }
    const primary = active[0];
    parts.push(
      `<button class="annotated-inline ${annotationClassForCollection(primary.collection)}" type="button"
        title="${escapeHtml(primary.tooltip || '')}"
        data-action="navigate-entity"
        data-row-id="${escapeHtml(row.rowId)}"
        data-collection="${escapeHtml(primary.collection)}"
        data-key="${escapeHtml(primary.key)}">${escapeHtml(segmentText)}</button>`
    );
  }
  return `<div class="annotated-inline-wrap">${parts.join("")}</div>`;
}


function normalizeSpanObject(span) {
      if (!span || typeof span.start !== "number" || typeof span.end !== "number") return null;
      if (span.end <= span.start) return null;
      return { start: span.start, end: span.end };
    }

    function dedupeSpans(spans) {
      const out = [];
      const seen = new Set();
      for (const raw of spans || []) {
        const span = normalizeSpanObject(raw);
        if (!span) continue;
        const key = `${span.start}:${span.end}`;
        if (seen.has(key)) continue;
        seen.add(key);
        out.push(span);
      }
      out.sort((a, b) => a.start - b.start || a.end - b.end);
      return out;
    }

    function getItemByKey(key) {
      return key ? (state.entityIndex.get(key)?.item || null) : null;
    }

    function getFocusSpansForItem(collection, item) {
      if (!item) return [];
      const raw = item.raw || {};
      let spans = [];
      if (collection === "parties" || collection === "locations") {
        spans = [raw.name, ...(raw.mentions || [])];
      } else if (collection === "terms") {
        spans = [raw.name, raw.meaning, ...(raw.mentions || [])];
      } else if (collection === "signatures") {
        spans = [raw.span, raw.title, raw.code, raw.type_name];
      }
      return dedupeSpans(spans);
    }

    function getFocusSpansForDateGroup(group) {
      if (!group) return [];
      return dedupeSpans(group.items.flatMap((item) => (item.raw?.mentions || [])));
    }

    function getFocusContext(row, collection, selectedKey) {
      if (!row) return { label: "", spans: [] };
      if (collection === "dates") {
        const group = getDateGroups(row).find((item) => item.key === selectedKey) || null;
        return {
          label: group?.displayValue || row.file_name,
          spans: getFocusSpansForDateGroup(group),
        };
      }
      if (isCustomPreviewCollection(collection)) {
        const column = getCustomColumnById(collection);
        const item = getCustomPreviewItems(row, collection).find((entry) => entry.key === selectedKey) || null;
        if (column?.colType === "span") {
          return {
            label: item?.title || item?.name || row.file_name,
            spans: item?.span ? [item.span] : [],
          };
        }
        const nativeCollection = item?.items ? "dates" : (item?.kind === "person" ? "parties" : item?.kind === "location" ? "locations" : item?.kind === "term" ? "terms" : item?.kind === "signature" ? "signatures" : "");
        return {
          label: item?.name || row.file_name,
          spans: nativeCollection ? getFocusSpansForItem(nativeCollection, item) : [],
        };
      }
      const item = getItemByKey(selectedKey);
      return {
        label: item?.name || row.file_name,
        spans: getFocusSpansForItem(collection, item),
      };
    }

    function renderDocumentViewerCard(row, collection, selectedKey) {
      const docText = row?.document?.text || "";
      const focus = getFocusContext(row, collection, selectedKey);
      const spans = dedupeSpans(focus.spans);
      const codePoints = getCodePoints(docText);
      let cursor = 0;
      const parts = [];

      for (let i = 0; i < spans.length; i += 1) {
        const span = spans[i];
        if (span.start < cursor) continue;
        if (span.start > cursor) parts.push(escapeHtml(codePoints.slice(cursor, span.start).join("")));
        const inner = escapeHtml(codePoints.slice(span.start, span.end).join(""));
        parts.push(`<mark class="viewer-highlight ${i === 0 ? "is-primary" : ""}" data-viewer-index="${i}">${inner}</mark>`);
        cursor = span.end;
      }
      if (cursor < codePoints.length) parts.push(escapeHtml(codePoints.slice(cursor).join("")));

      const viewerBody = docText
        ? `<div class="viewer-shell">
            <div class="viewer-toolbar">
              <span>${escapeHtml(focus.label || row.file_name)}</span>
              ${spans.length ? `<button class="viewer-jump-button" type="button" data-action="open-inline-viewer" data-row-id="${escapeHtml(row.rowId)}" data-collection="${escapeHtml(collection)}" data-key="${escapeHtml(selectedKey || "")}">Open ILGS viewer</button>` : `<span class="viewer-empty">No span highlights available for this selection.</span>`}
            </div>
            <div class="viewer-document" id="preview-document-viewer">${parts.join("")}</div>
          </div>`
        : '<div class="viewer-empty">No document text available for this file.</div>';

      return renderCard("ILGS document viewer", viewerBody);
    }

function capturePreviewScrollState() {
  if (!state.preview || state.viewer) return;
  const listPanel = elements.overlay.querySelector(".preview-list-panel");
  const detailPanel = elements.overlay.querySelector(".preview-detail-panel");
  if (listPanel) state.preview.listScrollTop = listPanel.scrollTop;
  if (detailPanel) state.preview.detailScrollTop = detailPanel.scrollTop;
}

function restorePreviewScrollState() {
  if (!state.preview || state.viewer) return;
  const listTop = Number(state.preview.listScrollTop || 0);
  const detailTop = Number(state.preview.detailScrollTop || 0);
  requestAnimationFrame(() => {
    const listPanel = elements.overlay.querySelector(".preview-list-panel");
    const detailPanel = elements.overlay.querySelector(".preview-detail-panel");
    if (listPanel) listPanel.scrollTop = listTop;
    if (detailPanel) detailPanel.scrollTop = detailTop;
  });
}

function renderPreviewOverlay() {
  if (state.viewer) {
    const row = viewerGetRow();
    if (!row) {
      state.viewer = null;
      renderPreviewOverlay();
      return;
    }
    elements.overlay.classList.add("open");
    elements.overlay.setAttribute("aria-hidden", "false");
    elements.overlay.innerHTML = buildInlineViewerOverlay(row);
    elements.body.classList.remove("entity-preview-open");
    elements.body.classList.add("viewer-open");
    requestAnimationFrame(() => initInlineViewerFrame());
    return;
  }

  if (!state.preview) {
    elements.overlay.classList.remove("open");
    elements.overlay.setAttribute("aria-hidden", "true");
    elements.overlay.innerHTML = "";
    elements.body.classList.remove("entity-preview-open");
    elements.body.classList.remove("viewer-open");
    return;
  }

  const row = getRowById(state.preview.rowId);
  if (!row) {
    state.preview = null;
    renderPreviewOverlay();
    return;
  }

  const activeCollection = state.preview.activeCollection || "parties";
  const visibleItems = getFilteredPreviewItems(row, activeCollection);
  if (!state.preview.selectedKeys[activeCollection] && visibleItems[0]) state.preview.selectedKeys[activeCollection] = visibleItems[0].key;
  let selectedKey = state.preview.selectedKeys[activeCollection] || "";
  if (visibleItems.length && !visibleItems.some((item) => item.key === selectedKey)) {
    selectedKey = visibleItems[0].key;
    state.preview.selectedKeys[activeCollection] = selectedKey;
  }

  let detailHtml = '<div class="empty-panel">Nothing selected.</div>';
  const previewTabs = getPreviewTabs();
  const activeCustomColumn = getCustomColumnById(activeCollection);
  if (activeCollection === "dates") {
    const selectedGroup = visibleItems.find((group) => group.key === selectedKey) || visibleItems[0] || null;
    if (selectedGroup) state.preview.selectedKeys[activeCollection] = selectedGroup.key;
    detailHtml = renderDateDetail(row, selectedGroup);
  } else if (activeCustomColumn) {
    const selectedItem = visibleItems.find((item) => item.key === selectedKey) || visibleItems[0] || null;
    if (selectedItem) state.preview.selectedKeys[activeCollection] = selectedItem.key;
    if (activeCustomColumn.colType === "entity") {
      if (selectedItem?.items) detailHtml = renderDateDetail(row, selectedItem);
      else if (selectedItem?.kind === "person") detailHtml = renderPersonDetail(row, selectedItem);
      else if (selectedItem?.kind === "location") detailHtml = renderLocationDetail(row, selectedItem);
      else if (selectedItem?.kind === "term") detailHtml = renderTermDetail(row, selectedItem);
      else if (selectedItem?.kind === "signature") detailHtml = renderSignatureDetail(row, selectedItem);
      else detailHtml = '<div class="empty-panel">Choose an extracted entity to inspect its metadata.</div>';
    } else {
      detailHtml = selectedItem ? renderCustomSpanDetail(row, selectedItem) : '<div class="empty-panel">Choose a span to inspect its metadata.</div>';
    }
  } else {
    const selectedItem = selectedKey ? (state.entityIndex.get(selectedKey)?.item || null) : null;
    if (activeCollection === "parties") detailHtml = selectedItem ? renderPersonDetail(row, selectedItem) : '<div class="empty-panel">Choose a party to inspect its metadata.</div>';
    if (activeCollection === "locations") detailHtml = selectedItem ? renderLocationDetail(row, selectedItem) : '<div class="empty-panel">Choose a location to inspect its metadata.</div>';
    if (activeCollection === "terms") detailHtml = selectedItem ? renderTermDetail(row, selectedItem) : '<div class="empty-panel">Choose a defined term to inspect its metadata.</div>';
    if (activeCollection === "signatures") detailHtml = selectedItem ? renderSignatureDetail(row, selectedItem) : '<div class="empty-panel">Choose a signature segment to inspect its metadata.</div>';
  }

  const tabs = previewTabs.map((tab) => {
    const count = getPreviewItems(row, tab.key).length;
    return `<button class="tab-button ${tab.key === activeCollection ? "is-active" : ""}" type="button" data-action="switch-tab" data-collection="${escapeHtml(tab.key)}"><span>${escapeHtml(tab.label)}</span><span class="tab-count">${escapeHtml(String(count))}</span></button>`;
  }).join("");

  elements.overlay.innerHTML = `
    <div class="overlay-backdrop" data-action="close-overlay"></div>
    <div class="preview-modal" role="dialog" aria-modal="true" aria-label="Entity preview overlay">
      <div class="preview-header">
        <div>
          <div class="preview-file">${escapeHtml(row.file_name)}</div>
          
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
          <button class="close-button" type="button" data-action="close-overlay">×</button>
        </div>
      </div>

      <div class="preview-tabs">${tabs}</div>

      <div class="preview-layout">
        <aside class="preview-list-panel">
          ${renderCollectionList(row, activeCollection, selectedKey)}
        </aside>
        <section class="preview-detail-panel">
          ${detailHtml}
        </section>
      </div>
    </div>
  `;

  elements.overlay.classList.add("open");
  elements.overlay.setAttribute("aria-hidden", "false");
  elements.body.classList.remove("viewer-open");
  elements.body.classList.add("entity-preview-open");
  restorePreviewScrollState();
}


function jumpToViewerHighlight() {
  viewerScrollToSelection();
}

function openPreview(rowId, collection, key = "", options = {}) {
  const row = getRowById(rowId);
  if (!row) return;
  const previous = state.preview && state.preview.rowId === rowId ? state.preview : null;
  const selectedKeys = previous ? { ...previous.selectedKeys } : {};
  const searchTerms = previous ? { ...previous.searchTerms } : {};
  const items = getFilteredPreviewItems(row, collection);
  if (key) selectedKeys[collection] = key;
  else if (!options.keepUnselected && !selectedKeys[collection] && items[0]) selectedKeys[collection] = items[0].key;
  state.preview = {
    rowId,
    activeCollection: collection,
    selectedKeys,
    searchTerms,
    listScrollTop: previous ? Number(previous.listScrollTop || 0) : 0,
    detailScrollTop: 0,
    jumpToViewerAfterRender: !!options.jumpToViewerAfterRender,
  };
  renderPreviewOverlay();
}

function openDocumentPreview(rowId) {
  openIlgsViewer(rowId);
}

function switchPreviewTab(collection) {
  if (!state.preview) return;
  capturePreviewScrollState();
  const row = getRowById(state.preview.rowId);
  if (!row) return;
  state.preview.activeCollection = collection;
  state.preview.listScrollTop = 0;
  state.preview.detailScrollTop = 0;
  const items = getFilteredPreviewItems(row, collection);
  if (!state.preview.selectedKeys[collection] && items[0]) state.preview.selectedKeys[collection] = items[0].key;
  renderPreviewOverlay();
  const input = document.getElementById("preview-search-input");
  if (input) input.focus();
}

function selectPreviewEntity(key) {
  if (!state.preview || !key) return;
  capturePreviewScrollState();
  state.preview.selectedKeys[state.preview.activeCollection] = key;
  state.preview.detailScrollTop = 0;
  renderPreviewOverlay();
}

function navigateToEntity(rowId, collection, key) {

}

function closePreview() {
  state.preview = null;
  state.viewer = null;
  clearInlineViewerUrl();
  elements.body.classList.remove("entity-preview-open");
  elements.body.classList.remove("viewer-open");

}

function columnSupportsSort(column) {
  return !!(column && (column.kind === "file" || column.kind === "entities" || column.columnType === "custom"));
}

function setSort(columnId, direction) {
  if (!columnId) return;
  const nextDirection = direction === "desc" ? "desc" : "asc";
  if (state.sort?.columnId === columnId && state.sort?.direction === nextDirection) {
    clearSort();
    return;
  }
  state.sort = { columnId, direction: nextDirection };
  renderTable();
}

function clearSort() {
  state.sort = { columnId: "", direction: "asc" };
  renderTable();
}

function getEditableColumn(columnId) {
  return state.customColumns.find((item) => item.id === columnId) || null;
}

function startRenameColumn(columnId) {
  const column = getEditableColumn(columnId);
  if (!column) return;
  state.columnEdit = { columnId, value: column.label || "" };
  renderHeader();
  requestAnimationFrame(() => {
    const input = document.querySelector(`[data-role="rename-column-input"][data-column-id="${CSS.escape(columnId)}"]`);
    if (input) { input.focus(); input.select(); }
  });
}

function cancelRenameColumn() {
  if (!state.columnEdit) return;
  state.columnEdit = null;
  renderHeader();
}

function commitRenameColumn(columnId, rawValue) {
  const column = getEditableColumn(columnId);
  if (!column) return;
  const next = normalizeWhitespace(rawValue);
  state.columnEdit = null;
  if (next) column.label = next;
  renderHeader();
}

function syncRowsToCurrentVisibleOrder() {
  const orderedVisible = getVisibleRows();
  if (!orderedVisible.length) return;
  const visibleIds = new Set(orderedVisible.map((row) => row.rowId));
  const hiddenRows = state.rows.filter((row) => !visibleIds.has(row.rowId));
  state.rows = [...orderedVisible, ...hiddenRows];
}

function armRowDrag(rowId) {
  if (!rowId) return;
  if (state.sort?.columnId) {
    syncRowsToCurrentVisibleOrder();
    state.sort = { columnId: "", direction: "asc" };
    showToast("Sorting cleared.", 1200);
    renderTable();
  }
  state.dragDepth = 0;
  setDragState(false);
  state.rowDrag = { armedRowId: rowId, draggingRowId: "", overRowId: "" };
}

function reorderRows(sourceRowId, targetRowId) {
  if (!sourceRowId || !targetRowId || sourceRowId === targetRowId) return;
  const fromIndex = state.rows.findIndex((row) => row.rowId === sourceRowId);
  const toIndex = state.rows.findIndex((row) => row.rowId === targetRowId);
  if (fromIndex === -1 || toIndex === -1) return;
  const [moved] = state.rows.splice(fromIndex, 1);
  state.rows.splice(toIndex, 0, moved);
}

async function deleteRowById(rowId) {
  if (!rowId) return;
  const row = state.rows.find((item) => item.rowId === rowId);
  if (!row) return;
  const label = row.file_name || "this file";
  if (!window.confirm(`Delete ${label}?`)) return;
  try {
    if (row.doc_id) {
      await requestWithFallback(`/docs/${encodeURIComponent(row.doc_id)}`, { method: "DELETE" });
    }
  } catch (error) {
    console.warn("Delete request failed; removing row locally.", error);
  }
  removeRowFromEntityIndex(row);
  state.rows = state.rows.filter((item) => item.rowId !== rowId);
  if (state.preview && state.preview.rowId === rowId) closePreview();
  renderTable();
  showToast("File removed.", 1600);
}

function suppressRowDocumentClick(rowId, duration = 250) {
  if (!rowId) return;
  state.rowDragClickSuppress = { rowId, until: Date.now() + duration };
}

function clearRowDragState() {
  document.querySelectorAll("tr.is-row-dragging, tr.is-row-drop-target").forEach((node) => node.classList.remove("is-row-dragging", "is-row-drop-target"));
  state.rowDrag = null;
  state.rowDragInternalActive = false;
}

function handleRowDragStart(event) {
  const rowEl = event.target.closest ? event.target.closest("tr[data-row-id]") : null;
  const dragZone = event.target.closest ? event.target.closest('[data-drag-zone="true"]') : null;
  const deleteButton = event.target.closest ? event.target.closest('[data-action="delete-row"]') : null;
  const rowId = (dragZone && dragZone.getAttribute("data-row-id")) || (rowEl ? rowEl.getAttribute("data-row-id") : "");
  if (!rowEl || !dragZone || !rowId || deleteButton) {
    event.preventDefault();
    return;
  }
  if (state.sort?.columnId) {
    syncRowsToCurrentVisibleOrder();
    state.sort = { columnId: "", direction: "asc" };
    showToast("Sorting cleared.", 1200);
  }
  state.rowDrag = { draggingRowId: rowId, overRowId: "" };
  state.rowDragInternalActive = true;
  rowEl.classList.add("is-row-dragging");
  if (event.dataTransfer) {
    event.dataTransfer.effectAllowed = "move";
    try { event.dataTransfer.setData("text/plain", rowId); } catch (_) {}
    try { event.dataTransfer.setDragImage(rowEl, 24, 16); } catch (_) {}
  }
}

function handleRowDragOver(event) {
  const rowEl = event.target.closest ? event.target.closest("tr[data-row-id]") : null;
  if (!rowEl || !state.rowDrag || !state.rowDrag.draggingRowId) return;
  const rowId = rowEl.getAttribute("data-row-id") || "";
  if (!rowId || rowId === state.rowDrag.draggingRowId) return;
  event.preventDefault();
  document.querySelectorAll("tr.is-row-drop-target").forEach((node) => { if (node !== rowEl) node.classList.remove("is-row-drop-target"); });
  rowEl.classList.add("is-row-drop-target");
  state.rowDrag.overRowId = rowId;
  if (event.dataTransfer) event.dataTransfer.dropEffect = "move";
}

function handleRowDrop(event) {
  const rowEl = event.target.closest ? event.target.closest("tr[data-row-id]") : null;
  if (!rowEl || !state.rowDrag || !state.rowDrag.draggingRowId) return;
  event.preventDefault();
  const draggedRowId = state.rowDrag.draggingRowId;
  reorderRows(draggedRowId, rowEl.getAttribute("data-row-id") || "");
  suppressRowDocumentClick(draggedRowId);
  clearRowDragState();
  renderTable();
}

function handleRowDragEnd() {
  const draggedRowId = state.rowDrag?.draggingRowId || "";
  if (draggedRowId) suppressRowDocumentClick(draggedRowId);
  clearRowDragState();
}

function openColumnDialog() {
  state.columnDialog = {
    label: `New column ${state.customColumns.length + 1}`,
    query: "",
    colType: "span",

}

function closeColumnDialog() {

        </div>
        <div class="column-dialog-field">
          <label for="columnDialogQuery">Query</label>
          <textarea id="columnDialogQuery" class="column-dialog-textarea" data-role="column-dialog-query" placeholder="What should the server extract or search for?">${escapeHtml(dialog.query || "")}</textarea>
        </div>

        <div class="column-dialog-actions">

async function postColumnQuery(docIds, query, colType) {
  const response = await requestWithFallback("/column-query", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Accept": "application/json",
    },
    body: JSON.stringify({ doc_ids: docIds, query, col_type: colType }),
  });
  return response.json();
}

async function createCustomQueryColumn({ label, query, colType }) {
  const id = `custom-${Date.now()}-${state.customColumns.length + 1}`;
  const column = {
    id,
    label,
    query,
    colType,
    width: 300,
    status: "processing",
    processedCount: 0,
    totalCount: state.rows.length,
  };
  state.customColumns.push(column);
  state.rows.forEach((row) => {
    row.customColumnData = row.customColumnData || {};
    row.customColumnErrors = row.customColumnErrors || {};
    row.customColumnData[id] = [];
    delete row.customColumnErrors[id];
  });
  renderTable();
  showToast(`Adding ${label}…`, 1600);

  for (const row of state.rows) {
    try {
      const payload = await postColumnQuery([row.doc_id], query, colType);
      row.customColumnData[id] = Array.isArray(payload?.col_data) ? payload.col_data : [];
      delete row.customColumnErrors[id];
    } catch (error) {
      console.error(error);
      row.customColumnData[id] = [];
      row.customColumnErrors[id] = error?.message || String(error);
    }
    column.processedCount += 1;
    renderTable();
  }

  column.status = "ready";
  renderTable();
  showToast(`Added ${label}.`, 1800);
}

function addCustomColumn() {
  openColumnDialog();
}

function deleteCustomColumn(columnId) {
  const index = state.customColumns.findIndex((item) => item.id === columnId);
  if (index === -1) return;
  state.customColumns.splice(index, 1);
  state.rows.forEach((row) => {
    if (row.customColumnData) delete row.customColumnData[columnId];
    if (row.customColumnErrors) delete row.customColumnErrors[columnId];
  });
  renderTable();
}

function renameCustomColumn(columnId) {
  startRenameColumn(columnId);
}

function findColumn(columnId, columnType) {
  const source = columnType === "default" ? state.defaultColumns : state.customColumns;
  return source.find((col) => (columnType === "default" ? col.key : col.id) === columnId) || null;
}

function applyColumnWidth(columnId, width) {
  document.querySelectorAll(`[data-col-id="${CSS.escape(columnId)}"]`).forEach((node) => {
    node.style.width = `${width}px`;
    node.style.minWidth = `${width}px`;
  });
  const col = elements.colGroup.querySelector(`col[data-col-id="${CSS.escape(columnId)}"]`);
  if (col) {
    col.style.width = `${width}px`;
    col.style.minWidth = `${width}px`;
  }
}

function startResize(columnId, columnType, clientX) {
  const column = findColumn(columnId, columnType);
  if (!column) return;
  state.resize = { columnId, columnType, startX: clientX, startWidth: column.width };
  document.body.style.cursor = "col-resize";
  document.body.style.userSelect = "none";
  document.querySelector(`[data-col-id="${CSS.escape(columnId)}"]`)?.classList.add("is-resizing");
}

function updateResize(clientX) {
  if (!state.resize) return;
  const diff = clientX - state.resize.startX;
  const width = Math.max(260, state.resize.startWidth + diff);
  const column = findColumn(state.resize.columnId, state.resize.columnType);
  if (!column) return;
  column.width = width;
  applyColumnWidth(state.resize.columnId, width);
}

function stopResize() {
  if (!state.resize) return;
  document.querySelector(`[data-col-id="${CSS.escape(state.resize.columnId)}"]`)?.classList.remove("is-resizing");
  state.resize = null;
  document.body.style.cursor = "";
  document.body.style.userSelect = "";
}

async function applyCustomColumnsToRows(rows) {
  const newRows = [...(rows || [])];
  if (!newRows.length || !state.customColumns.length) return;

  for (const column of state.customColumns) {
    column.totalCount = state.rows.length;
    column.processedCount = Math.min(column.processedCount || 0, Math.max(0, state.rows.length - newRows.length));

    for (const row of newRows) {
      row.customColumnData = row.customColumnData || {};
      row.customColumnErrors = row.customColumnErrors || {};
      row.customColumnData[column.id] = [];
      delete row.customColumnErrors[column.id];
      renderTable();
      try {
        const payload = await postColumnQuery([row.doc_id], column.query, column.colType);
        row.customColumnData[column.id] = Array.isArray(payload?.col_data) ? payload.col_data : [];
        delete row.customColumnErrors[column.id];
      } catch (error) {
        console.error(error);
        row.customColumnData[column.id] = [];
        row.customColumnErrors[column.id] = error?.message || String(error);
      }
      column.processedCount += 1;
      renderTable();
    }

    column.status = "ready";
    column.totalCount = state.rows.length;
    column.processedCount = state.rows.length;
  }
}
