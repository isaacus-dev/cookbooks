<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Isaacus Tabular Review</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap");
    @import url("https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap");

    :root {
      --bg: #ffffff;
      --panel: #ffffff;
      --panel-2: #ffffff;
      --line: #e4e7ec;
      --line-strong: #d5dbe5;
      --text: #111827;
      --muted: #667085;
      --muted-2: #98a2b3;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --shadow: 0 20px 48px rgba(15, 23, 42, 0.14);
      --shadow-soft: 0 2px 10px rgba(15, 23, 42, 0.06);
      --overlay: rgba(255, 255, 255, 0.62);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", "Source Sans 3", "Source Sans Pro", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 17px;
    }

    body {
      padding: 18px;
      overflow: hidden;
    }

    button, input, textarea, select {
      font: inherit;
      font-family: inherit;
    }

    .workspace {
      height: calc(100vh - 36px);
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 10px;
      transition: filter 180ms ease, transform 180ms ease;
    }

    body.entity-preview-open .workspace {
      filter: blur(8px);
      transform: scale(0.994);
    }

    body.viewer-open .workspace {
      filter: none;
      transform: none;
    }

    .toolbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      min-height: 46px;
    }

    .upload-button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 210px;
      height: 42px;
      padding: 0 16px;
      border-radius: 6px;
      border: 1px solid var(--line-strong);
      background: rgba(255,255,255,0.94);
      color: #0f172a;
      box-shadow: var(--shadow-soft);
      cursor: pointer;
      transition: background 120ms ease, transform 120ms ease, border-color 120ms ease;
      user-select: none;
    }

    .upload-button:hover {
      background: #fff;
      transform: translateY(-1px);
      border-color: #cfd6df;
    }

    .upload-button[aria-busy="true"] {
      opacity: 0.72;
      pointer-events: none;
    }

    .upload-button input { display: none; }

    .sheet-shell {
      min-height: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      box-shadow: var(--shadow-soft);
    }

    .sheet-shell.drag-active {
      outline: 2px solid rgba(37, 99, 235, 0.24);
      outline-offset: -2px;
      background: #fcfdff;
    }

    .drop-overlay {
      position: absolute;
      inset: 0;
      z-index: 6;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.76);
      backdrop-filter: blur(3px);
      font-size: 1.1rem;
      font-weight: 600;
      color: #1f2937;
    }

    .sheet-shell.drag-active .drop-overlay {
      display: flex;
    }

    .sheet-scroll {
      width: 100%;
      height: 100%;
      overflow: auto;
      overscroll-behavior: contain;
      background: #fff;
    }

    table.sheet-table {
      width: max-content;
      min-width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      background: #fff;
    }

    table.sheet-table.fit-viewport {
      width: 100%;
      min-width: 100%;
    }

    table.sheet-table.overflowing {
      width: max-content;
      min-width: max-content;
    }

    .sheet-table th,
    .sheet-table td {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 11px 12px;
      vertical-align: top;
      text-align: left;
      background: #fff;
      overflow: visible;
    }

    .sheet-table th {
      position: sticky;
      top: 0;
      z-index: 3;
      background: var(--panel-2);
      color: #344054;
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.2;
      padding: 0;
      user-select: none;
    }

    .sheet-table th.file-col,
    .sheet-table td.file-col {
      position: sticky;
      left: 0;
      z-index: 2;
      background: #fff;
      box-shadow: inset -1px 0 0 var(--line);
      background-clip: padding-box;
    }

    .sheet-table th.file-col {
      z-index: 4;
      background: var(--panel-2);
    }

    .sheet-table tr:hover td {
      background: #fcfcfd;
    }

    .sheet-table tr:hover td.file-col {
      background: #fcfcfd;
    }

    .sheet-table tr:hover td.add-column-cell {
      background: #fff !important;
    }

    .header-inner {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 52px;
      padding: 0 12px;
      padding-right: 18px;
      white-space: nowrap;
    }

    .header-label {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-delete-button {
      margin-left: auto;
      width: 24px;
      height: 24px;
      border: 0;
      background: transparent;
      color: #98a2b3;
      border-radius: 2px;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .header-delete-button:hover {
      background: #f3f4f6;
      color: #111827;
    }

    .resize-handle {
      position: absolute;
      top: 0;
      right: -3px;
      width: 8px;
      height: 100%;
      cursor: col-resize;
      z-index: 5;
    }

    .resize-handle::after {
      content: "";
      position: absolute;
      top: 16%;
      bottom: 16%;
      left: 3px;
      width: 1px;
      background: transparent;
      transition: background 120ms ease;
    }

    .sheet-table th:hover .resize-handle::after,
    .sheet-table th.is-resizing .resize-handle::after {
      background: #c5ccd7;
    }

    .file-name {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.38;
      color: #111827;
      word-break: break-word;
      cursor: pointer;
    }

    .file-subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.42;
      word-break: break-word;
    }

    .cell-content {
      min-height: 112px;
      max-height: none;
      overflow: visible;
      display: flex;
      align-items: flex-start;
    }

    .chip-stack {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: flex-start;
    }

    .entity-chip,
    .tab-button,
    .entity-list-button,
    .add-column-button,
    .close-button,
    .timeline-card {
      appearance: none;
      font: inherit;
      font-family: inherit;
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
    }

    
.entity-chip {
      display: inline-flex;
      align-items: flex-start;
      min-height: 34px;
      max-width: 100%;
      padding: 7px 9px;
      border-radius: 4px;
      background: #ffffff;
      border-color: #e5e7eb;
      color: #1f2937;
      font-size: 0.95rem;
      line-height: 1.35;
      white-space: normal;
      word-break: break-word;
      text-align: left;
    }

    .entity-more {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 0 10px;
      border-radius: 4px;
      background: #eef2f7;
      border: 1px solid #dde4ec;
      color: #475467;
      font-size: 0.92rem;
      cursor: pointer;
    }

    .entity-chip:hover {
      background: #eef2f6;
      border-color: #dbe2ea;
    }

    .entity-more:hover {
      background: #e5ebf3;
      border-color: #d0d8e3;
    }

    .cell-empty {
      color: var(--muted-2);
      font-size: 0.98rem;
      line-height: 1.45;
    }

    .blank-cell {
      min-width: 160px;
      background: #fff;
    }

    .add-column-head,
    .add-column-cell {
      width: 52px !important;
      min-width: 52px !important;
      max-width: 52px !important;
      padding: 0 !important;
      text-align: center !important;
      background: var(--panel-2) !important;
      position: sticky;
      right: 0;
      box-shadow: inset 1px 0 0 var(--line);
      background-clip: padding-box;
    }

    .add-column-head {
      z-index: 4;
    }

    .add-column-cell {
      z-index: 1;
      background: #fff !important;
    }

    .add-column-button {
      width: 100%;
      height: 52px;
      color: var(--muted);
      font-size: 1.25rem;
      font-weight: 500;
    }

    .add-column-button:hover {
      color: #111827;
      background: #f3f5f7;
    }

    .empty-state {
      padding: 86px 28px !important;
      text-align: center !important;
      color: var(--muted);
      font-size: 1.04rem;
      line-height: 1.65;
      background: #fff !important;
    }

    .status-toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 30;
      min-width: 220px;
      max-width: 430px;
      padding: 12px 14px;
      border-radius: 6px;
      background: rgba(17, 24, 39, 0.94);
      color: #fff;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: opacity 160ms ease, transform 160ms ease;
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .status-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }

    .overlay.open {
      display: flex;
    }

    .overlay-backdrop {
      position: absolute;
      inset: 0;
      background: var(--overlay);
      backdrop-filter: blur(14px);
    }

    .preview-modal {
      position: relative;
      z-index: 1;
      width: min(1600px, calc(100vw - 12px));
      height: min(960px, calc(100vh - 12px));
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(220, 225, 231, 0.94);
      border-radius: 4px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: auto auto 1fr;
      overflow: hidden;
    }

    .preview-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.88);
    }

    .preview-file {
      font-size: 1.28rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.22;
    }

    .preview-subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.42;
    }

    .close-button {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      background: #f3f4f6;
      color: #111827;
      font-size: 1.25rem;
    }

    .close-button:hover {
      background: #eceff3;
    }

    .preview-tabs {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      background: rgba(255,255,255,0.84);
    }

    
.tab-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 14px;
      border-radius: 6px;
      border-color: #e5e7eb;
      background: #ffffff;
      color: #475467;
      white-space: nowrap;
    }

    .tab-button.is-active {
      background: var(--accent-soft);
      color: #1d4ed8;
      border-color: rgba(37, 99, 235, 0.18);
    }

    .tab-count {
      opacity: 0.84;
      font-size: 0.92rem;
    }

    .preview-layout {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(290px, 360px) 1fr;
    }

    .preview-list-panel {
      min-height: 0;
      overflow: auto;
      border-right: 1px solid var(--line);
      background: rgba(250, 251, 252, 0.88);
      padding: 16px;
    }

    .preview-search-wrap {
      position: sticky;
      top: -16px;
      z-index: 2;
      padding-bottom: 12px;
      margin-bottom: 12px;
      background: rgba(250, 251, 252, 0.96);
      backdrop-filter: blur(8px);
    }

    .preview-search-input {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #fff;
      color: #111827;
      outline: none;
    }

    .preview-search-input:focus {
      border-color: #cfd6df;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
    }

    .preview-detail-panel {
      min-height: 0;
      overflow: auto;
      padding: 18px;
      background: rgba(255,255,255,0.82);
    }

    .empty-panel {
      padding: 16px;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.55;
    }

    .entity-list {
      display: grid;
      gap: 9px;
    }

    .entity-list-button {
      width: 100%;
      text-align: left;
      padding: 13px 14px;
      border-radius: 6px;
      background: #fff;
      border-color: var(--line);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    .entity-list-button:hover {
      border-color: #d6dde7;
      background: #fcfdff;
    }

    .entity-list-button.is-selected {
      border-color: rgba(37, 99, 235, 0.28);
      background: var(--accent-soft);
    }

    .entity-list-title {
      font-size: 0.98rem;
      font-weight: 600;
      line-height: 1.34;
      color: #111827;
      word-break: break-word;
    }

    .entity-list-subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.42;
      word-break: break-word;
    }

    .detail-grid {
      display: grid;
      gap: 16px;
    }

    .detail-card {
      background: rgba(255,255,255,0.94);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .detail-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #fbfbfc;
    }

    .detail-card-title {
      font-size: 1rem;
      font-weight: 600;
      color: #111827;
    }

    .detail-card-title.title-font {
      font-family: "Inter", "Source Sans 3", "Source Sans Pro", ui-sans-serif, system-ui, sans-serif;
      font-size: 1.08rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .entity-section {
      margin-top: 18px;
    }

    .entity-section:first-child {
      margin-top: 0;
    }

    .preview-section-label {
      display: block;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .party-group-heading {
      margin: 14px 0 6px;
      padding: 0 2px;
      color: #667085;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .party-group-heading:first-child {
      margin-top: 0;
    }

    .annotated-inline-wrap {
      font-size: 0.96rem;
      line-height: 1.62;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .annotated-inline {
      border-radius: 2px;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      font: inherit;
      color: inherit;
      display: inline;
    }

    .annotated-inline.hl-person {
      background-color: #E0E7FF;
      border-bottom: 2px solid #6366F1;
      color: #312E81;
    }

    .annotated-inline.hl-location {
      background-color: #DCFCE7;
      border-bottom: 2px solid #22C55E;
      color: #064E3B;
    }

    .annotated-inline.hl-term,
    .annotated-inline.hl-term-special {
      background-color: #FEF3C7;
      border-bottom: 2px solid #F59E0B;
      color: #78350F;
    }

    .annotated-inline.hl-signature {
      background-color: #FCE7F3;
      border-bottom: 2px solid #EC4899;
      color: #831843;
    }

    .annotated-inline.hl-date {
      background-color: #CFFAFE;
      border-bottom: 2px solid #06B6D4;
      color: #155E75;
    }

    .annotated-inline:hover {
      filter: brightness(0.97);
    }


    .detail-card-body {
      padding: 16px;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px 16px;
    }

    .meta-item label {
      display: block;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .meta-item div {
      color: #111827;
      font-size: 0.96rem;
      line-height: 1.52;
      word-break: break-word;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    
.tag {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 9px;
      border-radius: 4px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      color: #334155;
      font-size: 0.9rem;
      line-height: 1.3;
      max-width: 100%;
      word-break: break-word;
    }

    
.meta-link-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      align-items: center;
    }

    
.meta-link {
      display: inline;
      padding: 0;
      border: 0;
      background: transparent;
      color: #1d4ed8;
      font-size: 0.95rem;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .meta-link:hover {
      color: #1e40af;
      background: transparent;
      border-color: transparent;
    }

    .meta-link {
      cursor: pointer;
    }

    .entity-chip,
    .entity-list-button,
    .entity-viewer-button,
    .file-open-button,
    .tab-button,
    .timeline-card,
    .preview-icon-button,
    .viewer-inline-link,
    .viewer-tab-btn,
    .viewer-entity-item,
    .viewer-tree-item,
    .viewer-piece {
      cursor: pointer;
    }


    .viewer-entity-item,
    .viewer-tree-item,
    button.viewer-entity-item,
    button.viewer-tree-item {
      appearance: none;
      -webkit-appearance: none;
      font: inherit;
      font-family: inherit;
      color: inherit;
      letter-spacing: inherit;
      text-transform: none;
    }

    .viewer-entity-item:focus,
    .viewer-tree-item:focus {
      outline: none;
    }

    .viewer-entity-item::-moz-focus-inner,
    .viewer-tree-item::-moz-focus-inner {
      border: 0;
    }

    .sheet-scroll {
      cursor: grab;
    }

    .sheet-scroll.is-panning {
      cursor: grabbing;
      user-select: none;
    }

    .entity-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: stretch;
    }

    .entity-viewer-button,
    .preview-icon-button {
      min-width: 38px;
      height: 24px;
      border: 0;
      background: transparent;
      color: #667085;
      border-radius: 2px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .entity-viewer-button:hover,
    .preview-icon-button:hover {
      background: #f3f4f6;
      color: #111827;
    }

    .entity-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .entity-header-title {
      min-width: 0;
      flex: 1;
    }

    .ilgs-modal {
      position: relative;
      z-index: 1;
      width: min(1600px, calc(100vw - 12px));
      height: min(960px, calc(100vh - 12px));
      background: #ffffff;
      border: 1px solid rgba(220, 225, 231, 0.94);
      border-radius: 4px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
    }

    .ilgs-topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px 14px;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }

    .ilgs-title {
      font-size: 2.15rem;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.1;
      letter-spacing: -0.035em;
      text-align: center;
    }

    .ilgs-meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.55;
      text-align: center;
      white-space: pre-wrap;
    }

    .ilgs-title-wrap {
      justify-self: center;
      text-align: center;
      min-width: 0;
    }

    .ilgs-topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    .ilgs-topbar-left {
      min-width: 0;
    }

    .ilgs-actions {

      min-width: 0;
      max-width: none;
    }

    .file-search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
      font-size: 0.95rem;
    }

    .file-search-input {
      width: 100%;
      height: 40px;
      padding: 0 12px 0 34px;
      border-radius: 6px;
      border: 1px solid var(--line-strong);
      background: rgba(255,255,255,0.96);
      color: #0f172a;
      box-shadow: var(--shadow-soft);
      outline: none;
    }

    .file-search-input:focus {
      border-color: #cfd6df;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
    }


    .header-inner {
      gap: 6px;
      padding-right: 8px;
    }

    .header-label {
      flex: 1 1 auto;
      min-width: 0;
    }

    .header-label.is-renamable {
      cursor: pointer;
      text-decoration: none;
      text-underline-offset: 3px;
    }

    .header-label.is-renamable:hover {
      text-decoration: underline dotted;
    }

    .header-actions {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      margin-left: 4px;
      position: relative;
      z-index: 1;
      flex: 0 0 auto;
    }

    .header-icon-button,
    .header-sort-button {
      width: 24px;
      height: 24px;
      border: 1px solid transparent;
      background: transparent;
      color: #98a2b3;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
    }

    .header-icon-button:hover,
    .header-sort-button:hover {
      background: #f3f4f6;
      color: #111827;
      border-color: #e5e7eb;
    }

    .header-sort-controls {
      display: inline-flex;
      align-items: center;
      gap: 1px;
      margin-left: 6px;
      margin-right: auto;
      border-right: 0;
      flex: 0 0 auto;
    }

    .header-sort-button.is-active {
      background: #eff6ff;
      color: #1d4ed8;
      border-color: rgba(37, 99, 235, 0.16);
    }

    .header-sort-button span {
      font-size: 0.82rem;
      line-height: 1;
    }

    .header-rename-input {
      width: 100%;
      min-width: 120px;
      height: 30px;
      padding: 0 10px;
      border-radius: 6px;
      border: 1px solid rgba(37, 99, 235, 0.22);
      background: #fff;
      color: #111827;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
      outline: none;
    }

    .sheet-table td.file-col {
      cursor: grab;
      user-select: none;
    }

    .sheet-table tr.is-row-dragging td.file-col {
      cursor: grabbing;
    }

    .file-cell-wrap {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      width: 100%;
      min-height: 100%;
      cursor: inherit;
      user-select: none;
    }

    .file-cell-wrap:active {
      cursor: inherit;
    }

    .file-open-button {
      flex: 1 1 auto;
      min-width: 0;
      width: 100%;
      cursor: pointer;
      user-select: none;
    }

    .row-delete-button {
      flex: 0 0 auto;
      width: 28px;
      min-height: 42px;
      border: 0;
      background: transparent;
      border-radius: 6px;
      color: #98a2b3;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      box-shadow: none;
    }

    .row-delete-button:hover {
      background: #f3f4f6;
      color: #111827;
    }

    .row-delete-button:focus-visible {
      outline: 2px solid rgba(37, 99, 235, 0.18);
      outline-offset: 2px;
    }

    tr.is-row-dragging td {
      opacity: 0.62;
    }

    tr.is-row-drop-target td {
      box-shadow: inset 0 2px 0 #2563eb;
    }

    tr.is-row-drop-target td.file-col {
      box-shadow: inset 0 2px 0 #2563eb, inset -1px 0 0 var(--line);
    }

    tr.is-row-drop-target td.add-column-cell {
      box-shadow: inset 0 2px 0 #2563eb, inset 1px 0 0 var(--line);
    }

    .entity-viewer-button,
    .preview-icon-button {
      min-width: 28px;
      height: 28px;
      padding: 0 7px;
      border: 1px solid var(--line-strong);
      background: #ffffff;
      color: #667085;
      border-radius: 6px;
    }

    .entity-viewer-button:hover,
    .preview-icon-button:hover {
      background: #f8fafc;
      border-color: #cfd6df;
      color: #111827;
    }

    .overlay > .viewer-shell {
      width: min(1600px, calc(100vw - 12px));
      height: min(960px, calc(100vh - 12px));
      border-radius: 6px;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .viewer-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px 14px;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }

    .viewer-header-meta {
      min-width: 0;
    }

    .viewer-header-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.25;
      word-break: break-word;
    }

    .viewer-header-subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.45;
      word-break: break-word;
    }

    .viewer-frame-wrap {
      position: relative;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .detail-grid,
    .detail-card,
    .detail-card-body,
    .entity-section,
    .meta-item div,
    .tag-list,
    .tag,
    .annotated-inline-wrap,
    .preview-detail-panel {
      text-align: left;
    }

    .viewer-loading {
      flex-direction: column;
      gap: 12px;
      text-align: center;
    }

    .viewer-loading-label {
      font-weight: 500;
    }

    .viewer-loading-bar {
      width: min(360px, calc(100% - 48px));
      height: 8px;
      border-radius: 999px;
      background: #e5e7eb;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(15,23,42,0.08);
    }

    .viewer-loading-bar-fill {
      width: 40%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #22c55e 0%, #16a34a 100%);
      animation: viewerLoadingSlide 1.15s ease-in-out infinite;
      transform-origin: left center;
    }

    @keyframes viewerLoadingSlide {
      0% { transform: translateX(-110%) scaleX(0.75); }
      55% { transform: translateX(95%) scaleX(1); }
      100% { transform: translateX(260%) scaleX(0.85); }
    }

    .viewer-overlay-controls {
      display: none;
    }



    .column-dialog-host {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .column-dialog-host.open {
      display: flex;
    }

    .column-dialog-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.62);
      backdrop-filter: blur(8px);
    }

    .column-dialog {
      position: relative;
      z-index: 1;
      width: min(520px, calc(100vw - 32px));
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .column-dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .column-dialog-title {
      font-size: 1rem;
      font-weight: 700;
      color: #111827;
    }

    .column-dialog-subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .column-dialog-form {
      padding: 16px 18px 18px;
      display: grid;
      gap: 14px;
    }

    .column-dialog-field {
      display: grid;
      gap: 6px;
    }

    .column-dialog-field label {
      color: #344054;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .column-dialog-input,
    .column-dialog-select {
      width: 100%;
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: #111827;
      outline: none;
    }

    .column-dialog-textarea {
      width: 100%;
      min-height: 96px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: #111827;
      outline: none;
      resize: vertical;
      font: inherit;
      font-family: inherit;
    }

    .column-dialog-input:focus,
    .column-dialog-select:focus,
    .column-dialog-textarea:focus {
      border-color: rgba(37, 99, 235, 0.35);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
    }

    .column-dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 2px;
    }

    .column-dialog-button {
      min-height: 40px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: #111827;
      cursor: pointer;
      font-weight: 600;
    }

    .column-dialog-button.primary {
      background: #111827;
      border-color: #111827;
      color: #fff;
    }

    .column-dialog-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .column-dialog-error {
      color: #b42318;
      background: #fef3f2;
      border: 1px solid #fecdca;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .custom-chip-stack {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: flex-start;
    }

    .custom-chip-button {
      appearance: none;
      cursor: pointer;
      text-decoration: none;
      font: inherit;
    }

    .custom-chip-button:hover {
      border-color: #94a3b8;
      background: #f8fafc;
    }

    .custom-chip {
      display: inline-flex;
      align-items: flex-start;
      max-width: 100%;
      min-height: 32px;
      padding: 7px 9px;
      border-radius: 4px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      color: #1f2937;
      font-size: 0.93rem;
      line-height: 1.35;
      white-space: normal;
      word-break: break-word;
      text-align: left;
    }


    .entity-chip.chip-person,
    .custom-chip.chip-person {
      background: #E0E7FF;
      border-color: rgba(99, 102, 241, 0.28);
      color: #312E81;
    }

    .entity-chip.chip-location,
    .custom-chip.chip-location {
      background: #DCFCE7;
      border-color: rgba(34, 197, 94, 0.26);
      color: #064E3B;
    }

    .entity-chip.chip-term,
    .custom-chip.chip-term {
      background: #FEF3C7;
      border-color: rgba(245, 158, 11, 0.28);
      color: #78350F;
    }

    .entity-chip.chip-date,
    .custom-chip.chip-date {
      background: #CFFAFE;
      border-color: rgba(6, 182, 212, 0.28);
      color: #155E75;
    }

    .entity-chip.chip-signature,
    .custom-chip.chip-signature {
      background: #FCE7F3;
      border-color: rgba(236, 72, 153, 0.24);
      color: #831843;
    }

    .custom-chip.chip-span {
      background: #EDE9FE;
      border-color: rgba(139, 92, 246, 0.28);
      color: #5B21B6;
    }

    function base64ToUtf8(text) {
      const binary = atob(String(text || ""));
      const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }


    function utf8ToBase64(text) {
      const bytes = new TextEncoder().encode(String(text ?? ""));
      let binary = "";
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    }

    function mapCollectionToViewerTab(collection) {
      if (collection === "parties") return "persons";
      if (collection === "locations") return "locations";
      if (collection === "terms") return "terms";
      if (collection === "dates") return "dates";
      return "";
    }

    function initInlineViewerFrame() {
      if (!state.viewer) return;
      const row = viewerGetRow();
      const frame = elements.overlay.querySelector(".viewer-iframe");
      const loading = elements.overlay.querySelector(".viewer-loading");
      if (!row || !frame) return;

      const viewerHtml = buildInlineViewerSrcdoc(row, state.viewer.currentTab || "parties", state.viewer.selectedKey || "");

      let settled = false;
      let poller = null;
      let timeoutId = null;

      const cleanup = () => {
        if (poller) window.clearInterval(poller);
        if (timeoutId) window.clearTimeout(timeoutId);
        window.removeEventListener("message", handleReadyMessage);
      };

      const trySendFocus = () => {
        try {
          const win = frame.contentWindow;
          if (win && typeof win.postMessage === "function") {
            win.postMessage(Object.assign({ type: "ilgs-focus" }, buildViewerBridgeFocus(row, state.viewer.currentTab || "parties", state.viewer.selectedKey || "")), "*");
          }
        } catch (err) {}
      };

      const showViewer = () => {
        try { scalePreviewFonts(frame); } catch (err) {}
        if (loading) loading.remove();
        frame.style.display = 'block';
      };

      const showReady = () => {
        if (settled) return;
        settled = true;
        cleanup();
        showViewer();
        trySendFocus();
      };

      const showFailure = (message) => {
        if (settled) return;
        settled = true;
        cleanup();
        if (loading) loading.remove();
        const shell = elements.overlay.querySelector(".viewer-shell");
        if (!shell) return;
        const existing = shell.querySelector(".viewer-error");
        if (existing) existing.remove();
        const error = document.createElement("div");
        error.className = "viewer-error";
        error.textContent = message || "The ILGS viewer failed to initialise.";
        shell.appendChild(error);
      };

      const handleReadyMessage = (event) => {
        const msg = event && event.data ? event.data : null;
        if (!msg || (msg.type !== "tx-ilgs-ready" && msg.type !== "ilgs-ready")) return;
        showReady();
      };
      window.addEventListener("message", handleReadyMessage);

      frame.onerror = () => showFailure("The ILGS viewer iframe failed to load.");

      frame.onload = () => {
        try { scalePreviewFonts(frame); } catch (err) {}
        trySendFocus();
      };

      poller = window.setInterval(() => {
        try {
          const win = frame.contentWindow;
          const doc = frame.contentDocument || (win && win.document);
          if (win && win.__ILGS_BRIDGE__) {
            showReady();
            return;
          }
          const text = (doc && doc.body && doc.body.innerText ? doc.body.innerText : '') || '';
          if (/Load enriched document/i.test(text) && /Reload document/i.test(text)) return;
          if (doc && doc.body && doc.body.children.length && /Contents|Isaacus|Kanon/i.test(text)) {
            showReady();
          }
        } catch (err) {}
      }, 250);

      timeoutId = window.setTimeout(() => {
        try {
          const doc = frame.contentDocument || (frame.contentWindow && frame.contentWindow.document);
          const text = (doc && doc.body && doc.body.innerText ? doc.body.innerText : '') || '';
          if (/Load enriched document/i.test(text) && /Reload document/i.test(text)) {
            showFailure("The ILGS viewer loaded its shell but not the enriched document.");
            return;
          }
          if (doc && doc.body && doc.body.children.length) {
            showReady();
            return;
          }
        } catch (err) {}
        showFailure("The ILGS viewer did not finish initialising.");
      }, 8000);

      clearInlineViewerUrl();
      try {
        const blob = new Blob([viewerHtml], { type: "text/html;charset=utf-8" });
        state.viewerUrl = URL.createObjectURL(blob);
        frame.src = state.viewerUrl;
      } catch (err) {
        console.warn("Blob viewer load failed, falling back to srcdoc.", err);
        try {
          frame.srcdoc = viewerHtml;
        } catch (err2) {
          console.error(err2);
          showFailure("The ILGS viewer failed to initialise.");
        }
      }
    }

      return String(value ?? "").replace(/\s+/g, " ").trim();
    }

    function shouldPreserveWordCase(word) {
      const lettersOnly = String(word || "").replace(/[^A-Za-z]/g, "");
      if (!lettersOnly) return true;
      if (lettersOnly === lettersOnly.toUpperCase()) return true;
      return /[A-Z]/.test(lettersOnly) && /[a-z]/.test(lettersOnly);
    }

    function normalizeWordCase(word) {
      if (shouldPreserveWordCase(word)) return word;
      const lower = String(word || "").toLowerCase();
      return lower.charAt(0).toUpperCase() + lower.slice(1);
    }

    function titleCase(value) {
      return String(value || "")
        .split(/([_\s]+)/)
        .map((part) => (/[_\s]+/.test(part) ? part.replace(/_/g, " ") : normalizeWordCase(part)))
        .join("")
        .trim();
    }

    function smartTitleCase(value) {
      const text = normalizeWhitespace(value);
      if (!text) return "";
      return text.replace(/[A-Za-z][A-Za-z'’.-]*/g, (word) => normalizeWordCase(word));
    }

    function previewEntityName(itemOrText, kind = "") {
      if (itemOrText && typeof itemOrText === "object") {
        if (itemOrText.kind === "date") return normalizeWhitespace(itemOrText.displayValue || itemOrText.name || itemOrText.id || "");
        return normalizeWhitespace(itemOrText.name || itemOrText.displayValue || itemOrText.id || "");
      }
      return normalizeWhitespace(itemOrText);
    }

    function getFilteredAliases(item) {
      if (!item || item.kind === "date" || item.kind === "term") return [];
      const base = normalizeWhitespace(item?.name || item?.displayValue || "").toLowerCase();
      return uniqStrings(item?.aliases || item?.mentions || []).filter((alias) => normalizeWhitespace(alias).toLowerCase() !== base);
    }

    function truncate(value, max = 90) {
      const text = normalizeWhitespace(value);
      return text.length <= max ? text : `${text.slice(0, max - 1)}…`;
    }

    function formatIsoDate(value) {
      if (!value) return "Unknown date";
      const date = new Date(`${value}T00:00:00`);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    }

    function uniqStrings(values) {
      const out = [];
      const seen = new Set();
      for (const raw of values || []) {
        const value = normalizeWhitespace(raw);
        if (!value || seen.has(value)) continue;
        seen.add(value);
        out.push(value);
      }
      return out;
    }

    function uniqBy(items, keyFn) {
      const out = [];
      const seen = new Set();
      for (const item of items || []) {
        const key = keyFn(item);
        if (seen.has(key)) continue;
        seen.add(key);
        out.push(item);
      }
      return out;
    }

    function getCodePoints(text) {
      const key = text || "";
      if (!state.codePointCache.has(key)) {
        state.codePointCache.set(key, Array.from(key));
      }
      return state.codePointCache.get(key);
    }

    function decodeSpan(span, text) {
      if (!span || typeof span.start !== "number" || typeof span.end !== "number") return "";
      return getCodePoints(text || "").slice(span.start, span.end).join("");
    }

    function decodeSpanSafe(span, text) {
      return normalizeWhitespace(decodeSpan(span, text));
    }

    function mentionTexts(spans, docText) {
      return uniqStrings((spans || []).map((span) => decodeSpanSafe(span, docText)));
    }

    function personDisplayName(person, docText) {
      return decodeSpanSafe(person.name, docText) || person.id || "Unnamed person";
    }

    function locationDisplayName(location, docText) {
      return decodeSpanSafe(location.name, docText) || location.id || "Unnamed location";
    }

    function termDisplayName(term, docText) {
      return decodeSpanSafe(term.name, docText) || term.id || "Unnamed term";
    }

    function signatureLabel(segment, docText) {
      const parts = [
        decodeSpanSafe(segment.type_name, docText),
        decodeSpanSafe(segment.code, docText),
        decodeSpanSafe(segment.title, docText),
      ].filter(Boolean);
      if (parts.length) return parts.join(" ");
      const spanText = decodeSpanSafe(segment.span, docText);
      if (spanText) return truncate(spanText, 90);
      return segment.id || "Signature";
    }

function endpointCandidates(path) {
      if (window.location.protocol === "file:") {
        return [
          `http://127.0.0.1:8000${path}`,
          `http://localhost:8000${path}`,
        ];
      }
      return [path];
    }

    async function requestWithFallback(path, options = {}) {
      let lastResponse = null;
      let lastError = null;
      for (const url of endpointCandidates(path)) {
        try {
          const response = await fetch(url, options);
          lastResponse = response;
          if (response.ok) return response;
        } catch (error) {
          lastError = error;
        }
      }
      if (lastResponse) {
        const text = await lastResponse.text();
        throw new Error(text || `Request failed with ${lastResponse.status}`);
      }
      if (lastError) {
        if (window.location.protocol === "file:") {
          throw new Error("The page is being opened from file://. Start the notebook server and use http://127.0.0.1:8000 instead, or keep the server running and let the app connect to localhost automatically.");
        }
        throw lastError;
      }
      throw new Error("Unable to reach the server.");
    }

    function normalizeDocumentText(value) {
  return String(value ?? "")
    .replace(/\r\n?/g, "\n")
    .replace(/[ \t]+\n/g, "\n")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}


function readPlainBufferText(arrayBuffer) {
  try {
    return new TextDecoder("utf-8", { fatal: true }).decode(arrayBuffer);
  } catch (error) {
    return new TextDecoder("latin1").decode(arrayBuffer);
  }
}

async function readPlainText(file) {
  return normalizeDocumentText(readPlainBufferText(await file.arrayBuffer()));
}


function chooseBestTextCandidate(candidates) {
  const usable = (candidates || [])
    .map((value) => normalizeDocumentText(value))
    .filter(Boolean);
  if (!usable.length) return "";
  usable.sort((a, b) => {
    const aScore = a.replace(/\s+/g, " ").trim().length;
    const bScore = b.replace(/\s+/g, " ").trim().length;
    return bScore - aScore || b.length - a.length;
  });
  return usable[0];
}

function dedupeAdjacentBlocks(values) {
  const out = [];
  let last = null;
  for (const raw of values || []) {
    const value = normalizeDocumentText(raw);
    if (!value || value === last) continue;
    out.push(value);
    last = value;
  }
  return out;
}

function getXmlLocalName(node) {
  return node ? (node.localName || String(node.nodeName || "").split(":").pop()) : "";
}

function getChildElements(node) {
  return Array.from(node?.childNodes || []).filter((child) => child && child.nodeType === Node.ELEMENT_NODE);
}


function collectDocxInlineText(node) {
  const parts = [];
  const walk = (element) => {
    if (!element || element.nodeType !== Node.ELEMENT_NODE) return;
    const localName = getXmlLocalName(element);
    if (localName === "t") {
      parts.push(element.textContent || "");
    } else if (localName === "tab") {
      parts.push("\t");
    } else if (localName === "br" || localName === "cr") {
      parts.push("\n");
    }
    for (const child of element.children || []) {
      walk(child);
    }
  };
  walk(node);
  return parts.join("");
}

function findFirstDescendantByLocalName(root, expectedName) {
  if (!root) return null;
  if (getXmlLocalName(root) === expectedName) return root;
  const stack = [...getChildElements(root)];
  while (stack.length) {
    const node = stack.shift();
    if (getXmlLocalName(node) === expectedName) return node;
    stack.push(...getChildElements(node));
  }
  return null;
}

function extractDocxBlocksFromXmlDocument(xmlDoc) {
  if (!xmlDoc || !xmlDoc.documentElement) return [];
  const root = xmlDoc.documentElement;
  const container = findFirstDescendantByLocalName(root, "body") || root;
  const blocks = [];

  for (const child of getChildElements(container)) {
    const localName = getXmlLocalName(child);
    if (localName === "p") {
      const paragraphText = collectDocxInlineText(child).trim();
      if (paragraphText) blocks.push(paragraphText);
      continue;
    }
    if (localName === "tbl") {
      for (const row of getChildElements(child).filter((item) => getXmlLocalName(item) === "tr")) {
        const rowCells = [];
        for (const cell of getChildElements(row).filter((item) => getXmlLocalName(item) === "tc")) {
          const cellParts = [];
          for (const para of getChildElements(cell).filter((item) => getXmlLocalName(item) === "p")) {
            const paragraphText = collectDocxInlineText(para).trim();
            if (paragraphText) cellParts.push(paragraphText);
          }
          const cellText = cellParts.join(" ").trim();
          if (cellText) rowCells.push(cellText);
        }
        if (rowCells.length) blocks.push(rowCells.join(" | "));
      }
    }
  }

  if (blocks.length) return blocks;
  const fallbackText = collectDocxInlineText(container).trim();
  return fallbackText ? [fallbackText] : [];
}

const DOCX_XML_PART_ORDER = [
  "word/document.xml",
  "word/header1.xml",
  "word/header2.xml",
  "word/header3.xml",
  "word/footer1.xml",
  "word/footer2.xml",
  "word/footer3.xml",
  "word/footnotes.xml",
  "word/endnotes.xml",
  "word/comments.xml",
];

async function readDocxText(file) {
  const arrayBuffer = await file.arrayBuffer();
  const parts = [];
  const seenParts = new Set();

  try {
    if (!window.JSZip) throw new Error("JSZip not loaded");
    const archive = await window.JSZip.loadAsync(arrayBuffer);
    const archiveNames = new Set(Object.keys(archive.files || {}));
    const orderedNames = DOCX_XML_PART_ORDER.filter((name) => archiveNames.has(name));
    orderedNames.push(
      ...Array.from(archiveNames)
        .filter((name) => name.startsWith("word/header") && name.endsWith(".xml") && !orderedNames.includes(name))
        .sort()
    );
    orderedNames.push(
      ...Array.from(archiveNames)
        .filter((name) => name.startsWith("word/footer") && name.endsWith(".xml") && !orderedNames.includes(name))
        .sort()
    );

    for (const name of orderedNames) {
      if (seenParts.has(name) || !archive.file(name)) continue;
      seenParts.add(name);
      try {
        const xmlText = await archive.file(name).async("string");
        const xmlDoc = new DOMParser().parseFromString(xmlText, "application/xml");
        if (xmlDoc.querySelector("parsererror")) continue;
        const blocks = extractDocxBlocksFromXmlDocument(xmlDoc);
        if (blocks.length) parts.push(...blocks);
      } catch (error) {
        console.warn("DOCX XML parse skipped for", name, error);
      }
    }
  } catch (error) {
    console.warn("DOCX zip parsing failed", error);
  }

  if (!parts.length) {
    try {
      const result = await mammoth.extractRawText({ arrayBuffer });
      const value = String(result?.value || "").replace(/\r\n?/g, "\n").trim();
      if (value) return value;
    } catch (error) {
      console.warn("DOCX fallback extraction failed", error);
    }
    return "";
  }

  const cleanedParts = [];
  let last = null;
  for (const part of parts) {
    const cleaned = String(part || "").trim();
    if (cleaned && cleaned !== last) {
      cleanedParts.push(cleaned);
      last = cleaned;
    }
  }
  return cleanedParts.join("\n\n").trim();
}

function isSkippableHtmlTextNode(node) {
  const parent = node && node.parentElement;
  if (!parent) return false;
  const tagName = String(parent.tagName || "").toLowerCase();
  return ["script", "style", "noscript", "template"].includes(tagName);
}

function extractTextFromHtmlLikeRenderer(markup) {
  const doc = new DOMParser().parseFromString(markup, "text/html");
  const root = doc.body || doc.documentElement;
  if (!root) return String(markup || "").trim();

  const walker = doc.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const parts = [];
  let current = walker.nextNode();
  while (current) {
    if (!isSkippableHtmlTextNode(current)) {
      const value = normalizeWhitespace(current.nodeValue || "");
      if (value) parts.push(value);
    }
    current = walker.nextNode();
  }
  return parts.join("\n").trim();
}

async function readHtmlText(file) {
  const markup = readPlainBufferText(await file.arrayBuffer());
  return extractTextFromHtmlLikeRenderer(markup);
}


function groupPdfItemsIntoLines(items) {
  const lines = [];
  for (const item of items || []) {
    const text = String(item?.str || "");
    if (!text.trim()) continue;

    const x = Array.isArray(item.transform) ? Number(item.transform[4] || 0) : Number(item.x || 0);
    const y = Array.isArray(item.transform) ? Number(item.transform[5] || 0) : Number(item.y || 0);
    const height = Number(item.height || 0);
    const tolerance = Math.max(2.5, height * 0.35 || 2.5);

    let line = lines.find((candidate) => Math.abs(candidate.y - y) <= tolerance);
    if (!line) {
      line = { y, maxHeight: height, items: [] };
      lines.push(line);
    } else {
      line.y = ((line.y * line.items.length) + y) / (line.items.length + 1);
      line.maxHeight = Math.max(line.maxHeight, height);
    }

    line.items.push({
      text,
      x,
      y,
      width: Number(item.width || 0),
      height,
    });
  }

  lines.sort((a, b) => b.y - a.y || (a.items[0]?.x || 0) - (b.items[0]?.x || 0));
  return lines;
}

function buildPdfLineText(items) {
  const ordered = [...(items || [])].sort((a, b) => a.x - b.x || b.y - a.y);
  let out = "";
  let previous = null;

  for (const item of ordered) {
    const text = String(item?.text || "");
    if (!text) continue;

    if (out && previous) {
      const estimatedWidth = item.width || Math.max(text.length, 1) * 4;
      const averageCharWidth = Math.max(2.5, estimatedWidth / Math.max(text.length, 1));
      const gap = item.x - previous.endX;
      const nextStartsWithPunctuation = /^[,.;:!?)]/.test(text);
      if (gap > Math.max(3, averageCharWidth * 0.6) && !nextStartsWithPunctuation && !/\s$/.test(out)) {
        out += " ";
      }
    }

    out += text;
    previous = {
      endX: item.x + (item.width || Math.max(text.length, 1) * 4),
    };
  }

  return normalizeWhitespace(out);
}

function buildPdfLayoutText(items) {
  const lines = groupPdfItemsIntoLines(items);
  const parts = [];
  let previousY = null;

  for (const line of lines) {
    const text = buildPdfLineText(line.items);
    if (!text) continue;

    if (previousY !== null && Math.abs(previousY - line.y) > Math.max(18, line.maxHeight * 1.9 || 18)) {
      parts.push("");
    }

    parts.push(text);
    previousY = line.y;
  }

  return normalizeDocumentText(parts.join("\n"));
}

async function readPdfText(file) {
  const pdfjsLib = await ensurePdfJs();
  const arrayBuffer = await file.arrayBuffer();
  const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
  const pdf = await loadingTask.promise;
  const pageTexts = [];

  for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
    const page = await pdf.getPage(pageNumber);
    const content = await page.getTextContent({ disableCombineTextItems: false, normalizeWhitespace: false });
    const items = content.items || [];
    const simpleText = normalizeDocumentText(items.map((item) => item.str || "").filter(Boolean).join(" "));
    const layoutText = buildPdfLayoutText(items);
    const best = chooseBestTextCandidate([simpleText, layoutText]);
    if (best) pageTexts.push(best);
  }

  return pageTexts.join("\n\n").trim();
}

async function fileToText(file) {
  const lower = file.name.toLowerCase();
  if (lower.endsWith(".pdf")) return readPdfText(file);
  if (lower.endsWith(".docx")) return readDocxText(file);
  if (lower.endsWith(".html") || lower.endsWith(".htm")) return readHtmlText(file);
  return readPlainText(file);
}

    function buildEntitySubtitle(item) {

    function createDateEventLabel(item) {

    }

    function getDateGroups(row) {
      const dates = [...(row?.entities?.dates || [])].sort((a, b) => {
        const av = a.value || "";
        const bv = b.value || "";
        if (av === bv) return (a.type || "").localeCompare(b.type || "");
        return av.localeCompare(bv);
      });

      const groups = [];
      const byValue = new Map();
      for (const item of dates) {
        const key = item.value || `unknown-${item.key}`;
        if (!byValue.has(key)) {
          byValue.set(key, {
            key: `${row.rowId}:dategroup:${key}`,
            value: item.value || "",
            displayValue: item.displayValue || formatIsoDate(item.value),
            items: [],
          });
          groups.push(byValue.get(key));
        }
        byValue.get(key).items.push(item);
      }

      for (const group of groups) {
        group.eventLabels = uniqStrings(group.items.map((item) => createDateEventLabel(item)));
        group.previewLabel = group.displayValue;

      return groups;
    }

    function expandContextSpan(text, rawSpan, padding = 120) {
      const span = normalizeSpanObject(rawSpan);
      if (!span || !text) return null;
      const cp = getCodePoints(text);
      const stopChars = new Set(["\n", "\r", ".", "!", "?", ";", ":"]);
      let start = Math.max(0, span.start - padding);
      let end = Math.min(cp.length, span.end + padding);

      while (start > 0 && !stopChars.has(cp[start - 1]) && (span.start - start) < 240) start -= 1;
      while (end < cp.length && !stopChars.has(cp[end]) && (end - span.end) < 240) end += 1;

      while (start < span.start && /\s/.test(cp[start] || "")) start += 1;
      while (end > span.end && /\s/.test(cp[end - 1] || "")) end -= 1;
      return end > start ? { start, end } : span;
    }

    function isStructuralDateContextSegment(segment) {
      if (!segment) return false;
      const haystack = [segment.type, segment.kind, segment.category, segment.type_name, segment.label]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();
      return /(^|)(table|heading)(|$)/.test(haystack);
    }

    function isDateContextSpanTooSmall(text, mention, candidateSpan) {
      const candidateText = decodeSpanSafe(candidateSpan, text);
      const mentionText = decodeSpanSafe(mention, text);
      if (!candidateText) return true;
      if (candidateText.length < 24) return true;
      if (mentionText && candidateText.length <= (mentionText.length + 8)) return true;
      return false;
    }

    function getDateContextSegmentSpan(row, rawSpan) {
      const mention = normalizeSpanObject(rawSpan);
      const text = row?.document?.text || "";
      const segments = Array.isArray(row?.document?.segments) ? row.document.segments : [];
      if (!mention) return null;
      const candidates = [];
      for (const seg of segments) {
        const segSpan = normalizeSpanObject(seg?.span);
        if (!segSpan) continue;
        if (segSpan.start <= mention.start && segSpan.end >= mention.end) {
          candidates.push({ seg, span: segSpan, length: segSpan.end - segSpan.start });
        }
      }
      candidates.sort((a, b) => a.length - b.length || a.span.start - b.span.start);
      const nonStructural = candidates.filter((entry) => !isStructuralDateContextSegment(entry.seg));
      const pool = nonStructural.length ? nonStructural : candidates;
      let chosen = pool[0] || null;

      if (chosen && isDateContextSpanTooSmall(text, mention, chosen.span)) {
        const parentCandidate = pool.find((entry) => entry.length > chosen.length && !isDateContextSpanTooSmall(text, mention, entry.span));
        if (parentCandidate) {
          chosen = parentCandidate;
        } else if (pool.length > 1) {
          chosen = pool[1];
        }
      }

      if (chosen && chosen.span.end > chosen.span.start && !isDateContextSpanTooSmall(text, mention, chosen.span)) {
        return chosen.span;
      }
      if (chosen && chosen.span.end > chosen.span.start && decodeSpanSafe(chosen.span, text)) {
        return chosen.span;
      }
      return expandContextSpan(text, mention);
    }

    function getDateContextEntries(row, group) {
      const text = row?.document?.text || "";
      if (!group || !text) return [];
      const out = [];
      const seen = new Set();
      for (const item of group.items || []) {
        const mentionSpans = dedupeSpans(item?.raw?.mentions || []);
        for (const mention of mentionSpans) {
          const contextSpan = getDateContextSegmentSpan(row, mention);
          if (!contextSpan) continue;
          const label = createDateEventLabel(item) || group.displayValue;
          const dedupeKey = `${contextSpan.start}:${contextSpan.end}:${label}`;
          if (seen.has(dedupeKey)) continue;
          seen.add(dedupeKey);
          out.push({ key: `${group.key}:context:${out.length}`, label, span: contextSpan, mention });
        }
      }
      return out;
    }

    function createRowId(entry, rowIndex = 0) {
      const rawDocId = normalizeWhitespace(
        entry?.doc_id || entry?.file_id || entry?.ilgs_doc_id || entry?.document?.id || ""
      );
      const safeDocId = rawDocId
        ? rawDocId.replace(/[^a-zA-Z0-9_-]+/g, "-").replace(/^-+|-+$/g, "")
        : "";
      state.nextRowSequence += 1;
      return safeDocId
        ? `row-${safeDocId}-${state.nextRowSequence}`
        : `row-${Date.now()}-${rowIndex}-${state.nextRowSequence}`;
    }

    function removeRowFromEntityIndex(row) {
      if (!row || !state.entityIndex) return;
      for (const collectionKey of ["parties", "locations", "terms", "signatures"]) {
        const items = Array.isArray(row?.entities?.[collectionKey]) ? row.entities[collectionKey] : [];
        for (const item of items) {
          if (item?.key) state.entityIndex.delete(item.key);
        }
