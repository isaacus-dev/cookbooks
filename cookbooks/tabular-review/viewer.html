function handleDocumentClick(event) {
  const sortButton = event.target.closest('[data-action="sort-column"]');
  if (sortButton) {
    setSort(sortButton.getAttribute("data-column-id"), sortButton.getAttribute("data-direction"));
    return;
  }

  const startRenameButton = event.target.closest('[data-action="start-rename-column"]');
  if (startRenameButton) {
    startRenameColumn(startRenameButton.getAttribute("data-column-id"));
    return;
  }


  const deleteButton = event.target.closest('[data-action="delete-row"]');
  if (deleteButton) {
    deleteRowById(deleteButton.getAttribute("data-row-id"));
    return;
  }

  const openButton = event.target.closest('[data-action="open-preview"]');
  if (openButton) {
    openPreview(
      openButton.getAttribute("data-row-id"),
      openButton.getAttribute("data-collection"),
      openButton.getAttribute("data-key") || ""
    );
    return;
  }

  const openCustomColumnItem = event.target.closest('[data-action="open-custom-column-item"]');
  if (openCustomColumnItem) {
    openPreview(
      openCustomColumnItem.getAttribute("data-row-id"),
      openCustomColumnItem.getAttribute("data-collection"),
      openCustomColumnItem.getAttribute("data-key") || ""
    );
    return;
  }

  const openDocument = event.target.closest('[data-action="open-document"]');
  if (openDocument) {
    const rowId = openDocument.getAttribute("data-row-id");
    const suppress = state.rowDragClickSuppress;
    if (suppress && suppress.rowId === rowId && Date.now() < suppress.until) return;
    openDocumentPreview(rowId);
    return;
  }

  const openInlineViewer = event.target.closest('[data-action="open-inline-viewer"]');
  if (openInlineViewer) {
    openIlgsViewer(
      openInlineViewer.getAttribute("data-row-id"),
      openInlineViewer.getAttribute("data-collection"),
      openInlineViewer.getAttribute("data-key") || ""
    );
    return;
  }

  const deleteColumnButton = event.target.closest('[data-action="delete-column"]');
  if (deleteColumnButton) {
    deleteCustomColumn(deleteColumnButton.getAttribute("data-column-id"));
    return;
  }

  const addColumnButton = event.target.closest('[data-action="add-column"]');
  if (addColumnButton) {
    openColumnDialog();
    return;
  }
}


function handleColumnDialogClick(event) {
  const actionElement = event.target.closest("[data-action]");
  if (!actionElement) return;
  const action = actionElement.getAttribute("data-action");
  if (action === "close-column-dialog") {
    closeColumnDialog();
  }
}

function handleColumnDialogInput(event) {
  if (!state.columnDialog) return;
  const role = event.target.getAttribute("data-role");
  if (role === "column-dialog-label") state.columnDialog.label = event.target.value || "";
  if (role === "column-dialog-query") state.columnDialog.query = event.target.value || "";
  if (role === "column-dialog-col-type") state.columnDialog.colType = event.target.value === "entity" ? "entity" : "span";
}

async function handleColumnDialogSubmit(event) {
  const form = event.target.closest ? event.target.closest('[data-action="submit-column-dialog"]') : null;
  if (!form) return;
  event.preventDefault();
  if (!state.columnDialog || state.columnDialog.submitting) return;
  const label = normalizeWhitespace(state.columnDialog.label || "");
  const query = normalizeWhitespace(state.columnDialog.query || "");
  const colType = state.columnDialog.colType === "entity" ? "entity" : "span";
  if (!label) {
    state.columnDialog.error = "Column name is required.";
    renderColumnDialog();
    return;
  }
  if (!query) {
    state.columnDialog.error = "Query is required.";
    renderColumnDialog();
    return;
  }
  state.columnDialog.submitting = true;
  state.columnDialog.error = "";
  renderColumnDialog();
  try {
    closeColumnDialog();
    await createCustomQueryColumn({ label, query, colType });
  } catch (error) {
    console.error(error);
    state.columnDialog = {
      label,
      query,
      colType,
      submitting: false,
      error: error?.message || String(error),
    };
    renderColumnDialog();
  }
}



function handleOverlayClick(event) {
  const actionElement = event.target.closest("[data-action]");
  if (!actionElement) return;
  const action = actionElement.getAttribute("data-action");
  if (action === "close-overlay") closePreview();
  if (action === "switch-tab") switchPreviewTab(actionElement.getAttribute("data-collection"));
  if (action === "select-preview-entity" || action === "select-preview-date-group") selectPreviewEntity(actionElement.getAttribute("data-key"));
  if (action === "navigate-entity") {
    if (state.viewer) {
      state.viewer.currentTab = actionElement.getAttribute("data-collection");
      state.viewer.selectedKey = actionElement.getAttribute("data-key");
      state.viewer.search = "";
      renderPreviewOverlay();
    } else {
      navigateToEntity(
        actionElement.getAttribute("data-row-id"),
        actionElement.getAttribute("data-collection"),
        actionElement.getAttribute("data-key")
      );
    }
  }
  if (action === "open-inline-viewer") {
    openIlgsViewer(
      actionElement.getAttribute("data-row-id"),
      actionElement.getAttribute("data-collection"),
      actionElement.getAttribute("data-key") || ""
    );
  }
  if (action === "viewer-switch-tab") {
    const row = viewerGetRow();
    if (!row || !state.viewer) return;
    state.viewer.currentTab = actionElement.getAttribute("data-tab");
    state.viewer.activeSegmentStart = null;
    state.viewer.activeSegmentRange = null;
    const first = viewerGetFilteredItems(row)[0];
    state.viewer.selectedKey = first ? first.key : "";
    renderPreviewOverlay();
  }
  if (action === "viewer-select-entity") {
    if (!state.viewer) return;
    state.viewer.selectedKey = actionElement.getAttribute("data-key");
    state.viewer.activeSegmentStart = null;
    state.viewer.activeSegmentRange = null;
    renderPreviewOverlay();
  }
  if (action === "viewer-piece-select") {
    if (!state.viewer) return;
    state.viewer.currentTab = actionElement.getAttribute("data-collection");
    state.viewer.selectedKey = actionElement.getAttribute("data-key");
    state.viewer.activeSegmentStart = null;
    state.viewer.activeSegmentRange = null;
    renderPreviewOverlay();
  }
  if (action === "viewer-select-segment") {
    if (!state.viewer) return;
    state.viewer.activeSegmentStart = Number(actionElement.getAttribute("data-start")) || 0;
    state.viewer.activeSegmentRange = {
      start: Number(actionElement.getAttribute("data-start")) || 0,
      end: Number(actionElement.getAttribute("data-end")) || 0,
    };
    renderPreviewOverlay();
  }
  if (action === "viewer-jump-segment") {
    const start = Number(actionElement.getAttribute("data-start")) || 0;
    const node = elements.overlay.querySelector(`.viewer-piece[data-start="${start}"]`) || elements.overlay.querySelector("#inlineDocumentText");
    if (node) node.scrollIntoView({ block: "center", behavior: "smooth" });
  }
  if (action === "viewer-open-metadata") {
    if (!state.viewer) return;
    const mapBack = state.viewer.currentTab === "persons" ? "parties" : state.viewer.currentTab;
    clearInlineViewerUrl();
    elements.body.classList.remove("viewer-open");
    openPreview(state.viewer.rowId, mapBack || "parties", state.viewer.selectedKey || "", { preserveSearch: false });
  }
}


function handleOverlayInput(event) {
      const previewInput = event.target.closest('[data-action="preview-search"]');
      if (previewInput && state.preview) {
        const collection = previewInput.getAttribute("data-collection");
        state.preview.searchTerms[collection] = previewInput.value || "";
        state.preview.listScrollTop = 0;
        state.preview.detailScrollTop = 0;
        renderPreviewOverlay();
        const next = document.getElementById("preview-search-input");
        if (next) {
          next.focus();
          const pos = (state.preview.searchTerms[collection] || "").length;
          next.setSelectionRange(pos, pos);
        }
        return;
      }

      const viewerInput = event.target.closest('[data-action="viewer-search"]');
      if (viewerInput && state.viewer) {
        state.viewer.search = viewerInput.value || "";
        const row = viewerGetRow();
        const first = row ? viewerGetFilteredItems(row)[0] : null;
        if (first) state.viewer.selectedKey = first.key;
        renderPreviewOverlay();
        const next = elements.overlay.querySelector('[data-action="viewer-search"]');
        if (next) {
          next.focus();
          const pos = (state.viewer.search || "").length;
          next.setSelectionRange(pos, pos);
        }
      }
    }

    
    function handleOverlayDblClick(event) {
      const actionElement = event.target.closest("[data-dbl-action],[data-action]");
      if (!actionElement || !state.viewer) return;
      const dblAction = actionElement.getAttribute("data-dbl-action") || actionElement.getAttribute("data-action");

      if (dblAction === "viewer-jump-to-entity") {
        const key = actionElement.getAttribute("data-key");
        state.viewer.selectedKey = key;
        renderPreviewOverlay();
        requestAnimationFrame(() => viewerScrollToSelection());
        return;
      }

      if (dblAction === "viewer-jump-segment") {
        const start = Number(actionElement.getAttribute("data-start")) || 0;
        const node = elements.overlay.querySelector(`.viewer-piece[data-start="${start}"]`) || elements.overlay.querySelector("#inlineDocumentText");
        if (node) node.scrollIntoView({ block: "center", behavior: "smooth" });
        return;
      }

      if (dblAction === "viewer-piece-select") {
        const key = actionElement.getAttribute("data-key");
        const collection = actionElement.getAttribute("data-collection");
        state.viewer.currentTab = collection;
        state.viewer.selectedKey = key;
        renderPreviewOverlay();
        requestAnimationFrame(() => viewerScrollToSelection());
        return;
      }
    }


    function setDragState(active) {
      elements.sheetShell.classList.toggle("drag-active", active);
      if (!state.isProcessing) {
        elements.uploadButtonText.textContent = active ? "Drop files" : "Upload files";
      }
    }

    function isFileDragEvent(event) {
      const types = event?.dataTransfer?.types;
      if (!types) return false;
      try {
        return Array.from(types).includes("Files");
      } catch (_) {
        return false;
      }
    }

    function handleDragEnter(event) {
      if (!isFileDragEvent(event) || state.rowDragInternalActive) return;
      event.preventDefault();
      state.dragDepth += 1;
      setDragState(true);
    }

    function handleDragOver(event) {
      if (!isFileDragEvent(event) || state.rowDragInternalActive) return;
      event.preventDefault();
      if (event.dataTransfer) event.dataTransfer.dropEffect = "copy";
    }

    function handleDragLeave(event) {
      if (!isFileDragEvent(event) || state.rowDragInternalActive) return;
      event.preventDefault();
      state.dragDepth = Math.max(0, state.dragDepth - 1);
      if (state.dragDepth === 0) setDragState(false);
    }

    async function handleDrop(event) {
      if (!isFileDragEvent(event) || state.rowDragInternalActive) return;
      event.preventDefault();
      state.dragDepth = 0;
      setDragState(false);
      const files = event.dataTransfer ? [...event.dataTransfer.files] : [];
      await handleFiles(files);
    }

    
function handlePointerDown(event) {
  const paneHandle = event.target.closest('[data-action="viewer-pane-resize"]');
  if (paneHandle && state.viewer) {
    state.viewerPaneResize = {
      startY: event.clientY,
      startPct: Number(state.viewer.panePercentage || 42),
    };
    event.preventDefault();
    event.stopPropagation();
    return;
  }

  const resizeHandle = event.target.closest('[data-action="resize-column"]');
  if (resizeHandle) {
    startResize(
      resizeHandle.getAttribute("data-column-id"),
      resizeHandle.getAttribute("data-column-type"),
      event.clientX
    );
    event.preventDefault();
    event.stopPropagation();
    return;
  }

  if (event.button !== 0) return;
  if (event.target.closest('button, input, textarea, select, a, .resize-handle, [data-action], [data-drag-zone="true"]')) return;

  const scroller = event.target.closest('#sheetScroll');
  if (!scroller) return;

  state.pan = {
    startX: event.clientX,
    startY: event.clientY,
    scrollLeft: elements.sheetScroll.scrollLeft,
    scrollTop: elements.sheetScroll.scrollTop,
  };
  elements.sheetScroll.classList.add("is-panning");
  event.preventDefault();
}

function updatePan(event) {
  if (!state.pan) return;
  const dx = event.clientX - state.pan.startX;
  const dy = event.clientY - state.pan.startY;
  elements.sheetScroll.scrollLeft = state.pan.scrollLeft - dx;
  elements.sheetScroll.scrollTop = state.pan.scrollTop - dy;
}

function stopPan() {
  if (!state.pan) return;
  state.pan = null;
  elements.sheetScroll.classList.remove("is-panning");
}


elements.fileInput.addEventListener("change", async (event) => {
      await handleFiles(event.target.files || []);
    });

    elements.fileSearchInput.addEventListener("input", (event) => {
      state.tableSearch = event.target.value || "";
      renderTable();
    });

    document.addEventListener("mousedown", handlePointerDown);
    document.addEventListener("click", handleDocumentClick);
    elements.columnDialogHost.addEventListener("click", handleColumnDialogClick);
    elements.columnDialogHost.addEventListener("input", handleColumnDialogInput);
    elements.columnDialogHost.addEventListener("submit", handleColumnDialogSubmit);
    elements.overlay.addEventListener("click", handleOverlayClick);
    elements.overlay.addEventListener("dblclick", handleOverlayDblClick);
    elements.overlay.addEventListener("input", handleOverlayInput);

    elements.headerRow.addEventListener("dblclick", (event) => {
      const customHeader = event.target.closest("[data-custom-column-id]");
      if (customHeader) renameCustomColumn(customHeader.getAttribute("data-custom-column-id"));
    });

    elements.headerRow.addEventListener("input", (event) => {
      const input = event.target.closest('[data-role="rename-column-input"]');
      if (!input || !state.columnEdit) return;
      state.columnEdit.value = input.value || "";
    });

    elements.headerRow.addEventListener("keydown", (event) => {
      const input = event.target.closest('[data-role="rename-column-input"]');
      if (!input) return;
      if (event.key === "Enter") {
        event.preventDefault();
        commitRenameColumn(input.getAttribute("data-column-id"), input.value || "");
      } else if (event.key === "Escape") {
        event.preventDefault();
        cancelRenameColumn();
      }
    });

    elements.headerRow.addEventListener("focusout", (event) => {
      const input = event.target.closest('[data-role="rename-column-input"]');
      if (!input) return;
      requestAnimationFrame(() => {
        if (document.activeElement === input) return;
        commitRenameColumn(input.getAttribute("data-column-id"), input.value || "");
      });
    });

    elements.tableBody.addEventListener("dragstart", handleRowDragStart);
    elements.tableBody.addEventListener("dragover", handleRowDragOver);
    elements.tableBody.addEventListener("drop", handleRowDrop);
    elements.tableBody.addEventListener("dragend", handleRowDragEnd);
    elements.tableBody.addEventListener("dragleave", (event) => {
      const rowEl = event.target.closest ? event.target.closest("tr[data-row-id]") : null;
      if (rowEl) rowEl.classList.remove("is-row-drop-target");
    });

    window.addEventListener("mousemove", (event) => {
      if (state.resize) updateResize(event.clientX);
      if (state.pan) updatePan(event);
      if (state.viewerPaneResize && state.viewer) {
        const modal = elements.overlay.querySelector(".ilgs-inspector");
        if (modal) {
          const rect = modal.getBoundingClientRect();
          const usable = Math.max(1, rect.height - 110);
          const delta = event.clientY - state.viewerPaneResize.startY;
          const pct = state.viewerPaneResize.startPct + (delta / usable) * 100;
          state.viewer.panePercentage = Math.max(25, Math.min(75, pct));
          renderPreviewOverlay();
        }
      }
    });

    window.addEventListener("mouseup", () => {
      stopResize();
      stopPan();
      state.viewerPaneResize = null;
    });

    window.addEventListener("dragenter", handleDragEnter);
    window.addEventListener("dragover", handleDragOver);
    window.addEventListener("dragleave", handleDragLeave);
    window.addEventListener("drop", handleDrop);

    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && (state.preview || state.viewer)) closePreview();
    });

    renderTable();
  </script>
</body>
</html>
