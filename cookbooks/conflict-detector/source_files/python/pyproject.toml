[project]
name = "isaacus-conflict"
version = "0.1.0"
description = "Find conflicts between two legal documents with Isaacus models."
requires-python = ">=3.11"
dependencies = [
    "ftfy",
    "isaacus",
    "msgspec",
    "numpy",
    "python-dotenv",
    "text2markdown",
    "anthropic",
    "google-genai",
    "openai",
]

[dependency-groups]
# The demo app in web/: `uv run --group web web/server/server.py`.
web = ["flask", "pyyaml"]
